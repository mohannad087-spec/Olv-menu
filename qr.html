<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLV — إدارة QR الطاولات</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#38240f,#0d0b08 35%,#050505 75%);color:#f5efe2;font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 14px 50px}.head{background:#121212;border:1px solid #4a3b26;border-radius:24px;padding:24px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.45)}h1{margin:0;color:#f0cf82;font-size:30px}.sub{color:#aaa;line-height:1.7;font-size:13px;margin:8px 0 18px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;max-width:760px;margin:auto}.field{width:100%;background:#0d0d0d;border:1px solid #403528;color:#fff;border-radius:11px;padding:12px}.btn{width:100%;padding:12px;border-radius:11px;border:1px solid #e1bd67;background:linear-gradient(135deg,#956a27,#f0cf76);color:#171006;font-weight:900}.btn.secondary{background:#171717;color:#e7ca83;border-color:#5e4a2c}.status{margin-top:12px;color:#bda66d;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.table{background:#fff;color:#111;border-radius:18px;padding:15px;text-align:center;break-inside:avoid;box-shadow:0 15px 40px rgba(0,0,0,.3)}.table h2{margin:0 0 9px;font-size:22px}.qr{min-height:220px;display:flex;justify-content:center;align-items:center}.url{font-size:9px;word-break:break-all;color:#777;margin:7px 0}.print{background:#111;color:#f0cf82;border:1px solid #75592e;border-radius:9px;padding:8px 14px;font-weight:900}.empty{padding:30px;color:#888;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wrap{padding:14px 10px 35px}}@media print{body{background:#fff}.wrap{padding:0}.head{display:none}.grid{grid-template-columns:repeat(3,1fr);gap:8px;margin:0}.table{box-shadow:none;border:1px solid #ddd;padding:8px}.table h2{font-size:16px}.qr{min-height:180px}.url,.print{display:none}}
</style>
</head>
<body>
<div class="wrap">
<section class="head">
<h1>OLV — QR الطاولات</h1>
<div class="sub">أنشئ QR مستقل لكل طاولة. عند المسح يفتح منيو OLV ويُثبت رقم الطاولة تلقائياً داخل الطلب.</div>
<div class="controls">
<input id="count" class="field" type="number" min="1" max="100" value="30" placeholder="عدد الطاولات">
<input id="start" class="field" type="number" min="1" max="999" value="1" placeholder="أول رقم طاولة">
<button class="btn" onclick="generate()">إنشاء أكواد الطاولات</button>
</div>
<div class="controls" style="margin-top:9px">
<button class="btn secondary" onclick="window.print()">طباعة كل الأكواد</button>
<button class="btn secondary" onclick="downloadAllLinks()">نسخ روابط الطاولات</button>
<button class="btn secondary" onclick="generate()">تحديث الأكواد</button>
</div>
<div id="status" class="status"></div>
</section>
<div id="grid" class="grid"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const base='https://mohannad087-spec.github.io/Olv-menu/';
function cleanNum(v,min,max){v=parseInt(v,10);if(!Number.isFinite(v))v=min;return Math.max(min,Math.min(max,v))}
function tableUrl(n){return base+'?table='+encodeURIComponent(String(n))}
function generate(){
 const count=cleanNum(document.getElementById('count').value,1,100),start=cleanNum(document.getElementById('start').value,1,999);
 const grid=document.getElementById('grid');grid.innerHTML='';
 const frag=document.createDocumentFragment();
 for(let i=0;i<count;i++){
  const n=start+i,u=tableUrl(n),card=document.createElement('article');card.className='table';
  card.innerHTML='<h2>طاولة '+n+'</h2><div class="qr"></div><div class="url">'+u+'</div><button class="print" type="button">طباعة هذا QR</button>';
  frag.appendChild(card);
  const qr=card.querySelector('.qr');new QRCode(qr,{text:u,width:200,height:200,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  card.querySelector('.print').onclick=()=>printOne(n,u,qr);
 }
 grid.appendChild(frag);document.getElementById('status').textContent='تم إنشاء '+count+' QR — من طاولة '+start+' إلى طاولة '+(start+count-1)+'.';
}
function printOne(n,u,qr){
 const img=qr.querySelector('img')?.src||qr.querySelector('canvas')?.toDataURL('image/png')||'';
 const w=window.open('','_blank');if(!w)return;
 w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>OLV — طاولة '+n+'</title><style>body{text-align:center;font-family:Arial;margin:40px}h1{font-size:32px}img{width:260px;height:260px}.url{font-size:10px;color:#777}</style></head><body><h1>OLV</h1><h2>طاولة '+n+'</h2><img src="'+img+'"><div class="url">'+u+'</div><script>window.onload=()=>window.print()<\\/script></body></html>');w.document.close();
}
function downloadAllLinks(){
 const count=cleanNum(document.getElementById('count').value,1,100),start=cleanNum(document.getElementById('start').value,1,999);
 const lines=[];for(let i=0;i<count;i++){const n=start+i;lines.push('طاولة '+n+' — '+tableUrl(n))}
 navigator.clipboard?.writeText(lines.join('\n')).then(()=>document.getElementById('status').textContent='تم نسخ روابط جميع الطاولات.').catch(()=>prompt('انسخ الروابط:',lines.join('\n')));
}
generate();
</script>
</body>
</html>
