<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLV — الطلبات</title><style>:root{--gold:#f4d47e;--line:#30291f}body{margin:0;background:radial-gradient(circle at 50% -15%,#38240f,#0d0b08 35%,#050505 75%);color:#fff9ed;font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.top h1{color:var(--gold);font:700 28px Georgia,serif}.btn{border:1px solid #66502b;background:#17120b;color:var(--gold);border-radius:11px;padding:10px 14px;font-weight:900}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.key{background:#111;border:1px solid #383027;color:#fff;padding:11px;border-radius:11px;flex:1;min-width:220px}.status{padding:10px;border:1px solid #443827;background:#12100d;border-radius:11px;color:#cbbb9b;font-size:12px;margin:12px 0}.status.ok{border-color:#315b3b;color:#b9dfc4}.status.err{border-color:#653333;color:#efb0b0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #3b3124;border-radius:18px;background:linear-gradient(160deg,#15130f,#0b0b0a);padding:15px}.head{display:flex;justify-content:space-between;gap:8px}.num{color:var(--gold);font-size:21px;font-weight:900}.time{color:#888;font-size:10px}.meta{margin:9px 0;color:#c6bba9;font-size:11px;line-height:1.7}.total{color:var(--gold);font-size:18px;font-weight:900}.order-status{width:100%;margin-top:10px;background:#111;border:1px solid #4a3a25;color:#f4d47e;border-radius:11px;padding:10px}.items{border-top:1px solid #29231d;margin-top:10px;padding-top:9px}.item{font-size:11px;padding:7px 0;border-bottom:1px solid #24201b}.muted{color:#8e877b}.empty{text-align:center;padding:50px;color:#777;border:1px dashed #3a3329;border-radius:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><h1>OLV — الطلبات</h1><div class="bar"><button class="btn" onclick="location.href='admin.html'">إدارة المنيو</button><button class="btn" onclick="load()">تحديث</button></div></div><div class="bar"><input id="key" class="key" type="password" placeholder="مفتاح الموظف الإداري"><button class="btn" onclick="saveKey();load()">دخول</button></div><div id="status" class="status">أدخل مفتاح الإدارة لعرض الطلبات.</div><div id="orders" class="grid"></div></div><script>const keyEl=document.getElementById('key'),statusEl=document.getElementById('status'),ordersEl=document.getElementById('orders');keyEl.value=sessionStorage.getItem('olv-admin-key')||'';const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));const names={new:'جديد',confirmed:'تم التأكيد',preparing:'قيد التحضير',ready:'جاهز',completed:'مكتمل',cancelled:'ملغى'};const statuses=['new','confirmed','preparing','ready','completed','cancelled'];function saveKey(){sessionStorage.setItem('olv-admin-key',keyEl.value.trim())}function setStatus(t,c=''){statusEl.textContent=t;statusEl.className='status '+c}async function api(url,opt={}){opt.headers=Object.assign({'x-olv-admin-key':sessionStorage.getItem('olv-admin-key')||''},opt.headers||{});const r=await fetch(url,opt),out=await r.json();if(!r.ok)throw Error(out.error||'Request failed');return out}async function load(){try{const out=await api('/api/orders?ts='+Date.now());render(out.orders||[]);setStatus('تم تحميل الطلبات — تحديث تلقائي كل 15 ثانية.','ok')}catch(e){setStatus(e.message,'err')}}function render(arr){ordersEl.innerHTML=arr.length?arr.map(o=>`<article class="card"><div class="head"><div class="num">#${esc(o.number)}</div><div class="time">${new Date(o.createdAt).toLocaleString('ar-JO')}</div></div><div class="meta"><b>${o.mode==='hall'?'داخل الكافيه':'توصيل'}</b>${o.table?` · طاولة ${esc(o.table)}`:''}${o.phone?`<br>هاتف: ${esc(o.phone)}`:''}${o.address?`<br>العنوان: ${esc(o.address)}`:''}</div><div class="items">${(o.items||[]).map(i=>`<div class="item"><b>${esc(i.label||i.id)}</b> × ${i.qty}<div class="muted">${esc(JSON.stringify(i.custom||{}))}</div></div>`).join('')}</div><div class="total">${Number(o.total||0).toFixed(2)} د.أ</div><select class="order-status" data-id="${esc(o.id)}" onchange="setOrder(this)">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${names[s]}</option>`).join('')}</select></article>`).join(''):'<div class="empty">لا توجد طلبات حالياً.</div>'}async function setOrder(el){try{el.disabled=true;await api('/api/orders',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id:el.dataset.id,status:el.value})});setStatus('تم تحديث حالة الطلب.','ok');}catch(e){setStatus(e.message,'err')}finally{el.disabled=false}}load();setInterval(load,15000);</script></body></html>
