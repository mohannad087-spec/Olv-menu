<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLV — الطلبات</title><link rel="preload" href="assets/fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/olv-theme.css?v=a5"><script>(function(){try{var h=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Amman",hour:"2-digit",hourCycle:"h23"}).format(new Date())),l=h>=6&&h<18;document.documentElement.dataset.olvTheme=l?"light":"dark";document.addEventListener("DOMContentLoaded",function(){document.body.classList.toggle("olv-light",l)});var m=document.querySelector("meta[name=theme-color]");if(m)m.content=l?"#efede9":"#1d1b18"}catch(e){}})()</script><style>
.wrap{max-width:1100px;margin:auto;padding:18px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.top h1{margin:0;font:500 26px/1.3 var(--display);color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 16px;font-weight:500}
.key{min-height:48px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:0 14px;border-radius:12px;flex:1;min-width:220px;font-size:16px}
.status{padding:12px 14px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;color:var(--ink2);font-size:14px;margin:12px 0}
.status.ok{color:var(--ink);border-color:var(--f3)}.status.err{color:var(--ink);border-color:var(--f0)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px}
.head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.num{display:flex;align-items:center;gap:8px;font:600 22px var(--font);color:var(--ink)}
.num:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink2)}
.card[data-status=new] .num:before{background:var(--f1)}.card[data-status=confirmed] .num:before{background:var(--f4)}.card[data-status=preparing] .num:before{background:var(--f2)}.card[data-status=ready] .num:before{background:var(--f3)}.card[data-status=cancelled] .num:before{background:var(--f0)}
.time{color:var(--ink2);font-size:13px}
.meta{margin:10px 0;color:var(--ink2);font-size:14px;line-height:1.8}.meta b{color:var(--ink)}
.total{font:600 19px var(--font);color:var(--ink)}
.order-status{width:100%;min-height:48px;margin-top:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:0 12px;font-size:16px}
.items{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.oi{font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}
.oi:last-child{border-bottom:0}
.muted{color:var(--ink2);font-size:13px}
.empty{text-align:center;padding:50px;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.stat-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink2)}.stat-chip b{color:var(--ink)}
.advance-btn{display:block;width:100%;min-height:48px;margin-top:8px;background:var(--primary);border:0;color:var(--on-primary);border-radius:12px;font-weight:600;font-size:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="bar"><button class="olv-back" data-back="waiter.html"></button><h1>OLV — الطلبات</h1></div><div class="bar"><button class="btn" onclick="load()">تحديث</button></div></div><div class="bar"><input id="key" class="key" type="password" placeholder="مفتاح الموظفين"><button class="btn" onclick="saveKey();load()">دخول</button></div><div id="status" class="status">أدخل مفتاح الموظفين لعرض الطلبات.</div><div id="stats" class="stats"></div><div id="orders" class="grid"></div><div style="text-align:center;padding:16px 0 6px;font-size:12px;color:var(--ink2)">© 2026 OLV. جميع الحقوق محفوظة.</div></div><script src="assets/back-nav.js"></script><script>const keyEl=document.getElementById('key'),statusEl=document.getElementById('status'),ordersEl=document.getElementById('orders'),statsEl=document.getElementById('stats');keyEl.value=sessionStorage.getItem('olv-staff-key')||'';const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));const names={new:'جديد',confirmed:'تم التأكيد',preparing:'قيد التحضير',ready:'جاهز',completed:'مكتمل',cancelled:'ملغى'};const statuses=['new','confirmed','preparing','ready','completed','cancelled'];const nextStep={new:['confirmed','تأكيد'],confirmed:['preparing','بدء التحضير'],preparing:['ready','جاهز'],ready:['completed','تسليم']};function saveKey(){sessionStorage.setItem('olv-staff-key',keyEl.value.trim())}function setStatus(t,c=''){statusEl.textContent=t;statusEl.className='status '+c}async function api(url,opt={}){opt.headers=Object.assign({'x-olv-staff-key':sessionStorage.getItem('olv-staff-key')||''},opt.headers||{});const r=await fetch(url,opt),out=await r.json();if(!r.ok)throw Error(out.error||'Request failed');return out}function renderStats(arr){const counts={};arr.forEach(o=>{const w=o.waiter||'';if(!w)return;counts[w]=(counts[w]||0)+1});const names2=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);statsEl.innerHTML=names2.length?names2.map(n=>`<div class="stat-chip"><b>${esc(n)}</b> — ${counts[n]} طلب</div>`).join(''):''}
async function load(){try{const out=await api('/api/orders?ts='+Date.now());const arr=out.orders||[];render(arr);renderStats(arr);setStatus('تم تحميل الطلبات — تحديث تلقائي كل 15 ثانية.','ok')}catch(e){setStatus(e.message,'err')}}function render(arr){ordersEl.innerHTML=arr.length?arr.map(o=>`<article class="card" data-status="${esc(o.status)}"><div class="head"><div class="num">#${esc(o.number)}</div><div class="time">${new Date(o.createdAt).toLocaleString('ar-JO')}</div></div><div class="meta"><b>${o.mode==='hall'?'داخل الكافيه':(o.mode==='takeaway'?'سفري':'توصيل')}</b>${o.table?` · طاولة ${esc(o.table)}`:''}${o.name?` · ${esc(o.name)}`:''}${o.waiter?` · النادل: ${esc(o.waiter)}`:''}${o.phone?`<br>هاتف: ${esc(o.phone)}`:''}${o.address?`<br>العنوان: ${esc(o.address)}`:''}</div><div class="items">${(o.items||[]).map(i=>`<div class="oi"><b>${esc(i.label||i.id)}</b> × ${i.qty}${i.custom&&Object.keys(i.custom).length?`<div class="muted">${esc(JSON.stringify(i.custom))}</div>`:''}</div>`).join('')}</div><div class="total">${Number(o.total||0).toFixed(2)} د.أ</div><select class="order-status" data-id="${esc(o.id)}" data-number="${esc(o.number)}" onchange="setOrder(this)">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${names[s]}</option>`).join('')}</select>${nextStep[o.status]?`<button class="advance-btn" onclick="quickAdvance('${esc(o.id)}','${nextStep[o.status][0]}',this,${esc(o.number)})">${nextStep[o.status][1]}</button>`:''}</article>`).join(''):'<div class="empty">لا توجد طلبات حالياً.</div>'}function notifyCustomerReady(o){let n=(o.phone||'').replace(/\D/g,'');if(!n)return;if(n.startsWith('0'))n='962'+n.slice(1);const msg=`مرحباً، طلبك رقم #${o.number} من OLV جاهز — تفضل لاستلامه`;window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,'_blank')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
// The API already retries write conflicts server-side, but add a thin client
// retry too so a transient network blip doesn't need a manual re-click.
async function patchOrderStatus(id,status,attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{return await api('/api/orders',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id,status})})}
    catch(e){lastErr=e;if(i<attempts-1)await sleep(500*(i+1))}
  }
  throw lastErr;
}
function reportStatusFailure(number,message){
  setStatus('فشل تحديث حالة الطلب #'+number+': '+message,'err');
  alert('فشل تحديث حالة الطلب #'+number+'\n'+message+'\n\nجرب كبسة "تحديث الحالة" مرة ثانية.');
}
async function setOrder(el){
  const number=el.dataset.number||'';
  try{el.disabled=true;const out=await patchOrderStatus(el.dataset.id,el.value);setStatus('تم تحديث حالة الطلب #'+number+'.','ok');if(el.value==='ready'&&out.order?.phone)notifyCustomerReady(out.order);load()}
  catch(e){reportStatusFailure(number,e.message);load()}
  finally{el.disabled=false}
}
async function quickAdvance(id,status,btn,number){
  try{btn.disabled=true;const out=await patchOrderStatus(id,status);setStatus('تم تحديث حالة الطلب #'+number+'.','ok');if(status==='ready'&&out.order?.phone)notifyCustomerReady(out.order);load()}
  catch(e){reportStatusFailure(number,e.message);btn.disabled=false}
}load();setInterval(load,15000);</script></body></html>
