<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>OLV — مطعم وكافيه</title>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#171717;--gold:#d8ad5b;--gold2:#f0cf82;--cream:#f5efe2;--muted:#9b968c;--line:#292722;--green:#8f9b72}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#2a2114 0,#0b0b0b 34%,#070707 70%);color:var(--cream);font-family:Arial,"Noto Sans Arabic",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:0 16px 110px}
.hero{padding:28px 0 20px;position:relative}.hero-card{position:relative;overflow:hidden;border:1px solid #3b3122;border-radius:30px;padding:28px 22px 24px;background:linear-gradient(135deg,rgba(31,26,18,.96),rgba(12,12,12,.98));box-shadow:0 24px 80px rgba(0,0,0,.45)}
.hero-card:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(216,173,91,.12);filter:blur(10px);top:-130px;left:-80px}.brand{position:relative;text-align:center}.logo{width:82px;height:82px;object-fit:contain;border-radius:22px;border:1px solid #5b4930;background:#080808;display:block;margin:0 auto 13px}.brand h1{font:700 34px Georgia,serif;letter-spacing:5px;margin:0;color:var(--gold2)}.brand p{margin:7px 0 0;color:#c8c0b0;font-size:13px}.hero-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{border:1px solid #4a3b27;color:#d8c9aa;background:#17130d;padding:7px 11px;border-radius:999px;font-size:11px}
.toolbar{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(#080808 72%,transparent);backdrop-filter:blur(12px)}.toolbar-inner{display:flex;gap:8px;align-items:center}.search{flex:1;background:#121212;border:1px solid var(--line);color:white;border-radius:14px;padding:12px 14px;outline:none}.search:focus{border-color:#806238}.lang{border:1px solid #66502e;background:#1b160e;color:var(--gold2);border-radius:14px;padding:11px 13px;font-weight:700}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid var(--line);background:#111;color:#aaa;border-radius:999px;padding:9px 14px;font-size:12px}.cat.active{background:linear-gradient(135deg,#d9ae5d,#a97d38);color:#171109;border-color:#d9ae5d;font-weight:800}
.section{margin-top:18px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:0 2px 11px}.section-title h2{margin:0;color:var(--gold2);font:700 23px Georgia,serif}.section-title span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{position:relative;background:linear-gradient(145deg,#171717,#0f0f0f);border:1px solid var(--line);border-radius:20px;padding:15px;min-height:184px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.2s}.item:hover{transform:translateY(-2px);border-color:#5a472a}.item.shisha-card{background:linear-gradient(145deg,#1a1712,#10100f);border-color:#4b3b25}.item.shisha-card:after{content:"";position:absolute;right:-55px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(216,173,91,.08)}.badge{font-size:10px;color:#19130b;background:var(--gold2);padding:5px 8px;border-radius:999px;display:inline-block;margin-bottom:9px;font-weight:800}.tag{font-size:10px;color:#b8a77f;border:1px solid #4b3d28;border-radius:999px;padding:4px 7px;display:inline-block;margin:0 4px 8px 0}.item h3{font-size:17px;margin:0 0 4px}.en{direction:ltr;text-align:right;color:#aaa395;font-size:11px}.desc{color:#8f8a80;font-size:11px;line-height:1.65;margin:8px 0 13px}.price-row{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}.price{color:var(--gold2);font-weight:800;font-size:15px}.add{min-width:42px;height:42px;border-radius:13px;border:1px solid #7f6233;background:#211a0e;color:var(--gold2);font-size:24px}.add:active{transform:scale(.94)}.flavor-hint{color:#c8b487;font-size:10px;margin-top:6px}
.empty{text-align:center;padding:40px 10px;color:#777}.cart{position:fixed;z-index:30;bottom:15px;left:14px;right:14px;max-width:900px;margin:auto;background:linear-gradient(100deg,#b5893d,#e7c36e);color:#17120a;border:0;border-radius:18px;padding:14px 17px;display:none;align-items:center;justify-content:space-between;font-weight:800;box-shadow:0 18px 40px rgba(0,0,0,.55)}.cart.show{display:flex}.cart small{display:block;font-weight:600;opacity:.7}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#101010;border-top:1px solid #4a3b26;border-radius:27px 27px 0 0;padding:20px;box-shadow:0 -25px 80px #000}.sheet-inner{max-width:700px;margin:auto}.sheet h2{margin:0 0 15px;color:var(--gold2);font:700 25px Georgia,serif}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.row small{display:block;color:#888;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:31px;height:31px;border-radius:9px;border:1px solid var(--line);background:#1d1d1d;color:#fff}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:800;padding:18px 0;color:var(--gold2)}.field{width:100%;background:#191919;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;margin:6px 0;outline:none}.primary{width:100%;background:linear-gradient(135deg,#b68d42,#e1bf69);color:#17120a;border:0;border-radius:13px;padding:14px;font-weight:800;margin-top:8px}.secondary{width:100%;background:#191919;color:#ddd;border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:8px}
.flavor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.flavor{background:#181818;border:1px solid #2d2a24;color:#ddd;border-radius:12px;padding:11px 7px;font-size:12px}.flavor.selected{border-color:var(--gold);background:#241c10;color:var(--gold2);box-shadow:inset 0 0 0 1px #806238}.type-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.type{border:1px solid #333;background:#171717;color:#ddd;border-radius:15px;padding:12px;text-align:right}.type.selected{border-color:var(--gold);background:#241c10}.type b{display:block;color:var(--gold2);margin-bottom:4px}.type small{color:#8e887d;font-size:10px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(15px);background:#eee;color:#111;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:70}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:620px){.grid{grid-template-columns:1fr}.item{min-height:160px}.flavor-grid{grid-template-columns:repeat(2,1fr)}.hero-card{padding-top:23px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="hero-card"><div class="brand">
<img class="logo" src="assets/olv-logo.png" alt="OLV"><h1>OLV</h1><p id="tagline">مطعم وكافيه</p>
<div class="hero-meta"><span class="pill">قائمة رقمية</span><span class="pill">اختيارات مميزة</span><span class="pill">OLV Experience</span></div>
</div></div></header>
<div class="toolbar"><div class="toolbar-inner"><input id="search" class="search" placeholder="ابحث عن صنف أو نكهة..." autocomplete="off"><button id="lang" class="lang">English</button></div><div id="cats" class="cats"></div></div>
<main id="menu"></main>
</div>
<button class="cart" id="cart"><span id="cartText">السلة</span><span id="cartTotal"></span></button>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-inner">
<h2 id="cartTitle">طلبك</h2><div id="cartItems"></div><div class="total"><span id="totalLabel">المجموع</span><span id="total"></span></div>
<input class="field" id="table" placeholder="رقم الطاولة / Table number"><textarea class="field" id="notes" rows="3" placeholder="ملاحظات على الطلب / Order notes"></textarea>
<button class="primary" id="send">تأكيد الطلب</button><button class="secondary" id="close">متابعة التصفح</button>
</div></div></div>

<div class="overlay" id="shishaOverlay"><div class="sheet"><div class="sheet-inner">
<h2 id="shishaTitle">اختَر الأرجيلة</h2><div id="typeRow" class="type-row"></div>
<div class="flavor-hint" id="flavorHint">ثم اختَر النكهة</div><div id="flavorGrid" class="flavor-grid"></div>
<button class="primary" id="addShisha">إضافة للسلة</button><button class="secondary" id="cancelShisha">إلغاء</button>
</div></div></div>
<script>
let DATA=null,lang="ar",active="all",cartItems=[],selectedType=null,selectedFlavor=null,shishaItem=null;
const $=id=>document.getElementById(id); const money=n=>`${n.toFixed(2)} JD`; const t=x=>x[lang];
async function init(){DATA=await fetch("data/menu.json").then(r=>r.json());renderCats();render()}
function renderCats(){const all={id:"all",ar:"الكل",en:"All"};$("cats").innerHTML=[all,...DATA.categories].map(c=>`<button class="cat ${active===c.id?"active":""}" onclick="setCat('${c.id}')">${t(c)}</button>`).join("")}
function setCat(c){active=c;renderCats();render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){
 $("tagline").textContent=lang==="ar"?DATA.settings.taglineAr:DATA.settings.taglineEn;
 const q=$("search").value.trim().toLowerCase();
 const cats=active==="all"?DATA.categories:DATA.categories.filter(c=>c.id===active);let out="";
 cats.forEach(c=>{
   let items=DATA.items.filter(i=>i.cat===c.id);
   if(active==="all"&&c.id==="popular")items=DATA.items.filter(i=>i.popular);
   if(q)items=items.filter(i=>(i.ar+" "+i.en+" "+(i.descAr||"")+" "+(i.descEn||"")).toLowerCase().includes(q));
   if(!items.length)return;
   out+=`<section class="section"><div class="section-title"><h2>${t(c)}</h2><span>${items.length} ${lang==="ar"?"أصناف":"items"}</span></div><div class="grid">`;
   items.forEach(i=>{
     const sh= i.cat==="shisha"; out+=`<article class="item ${sh?"shisha-card":""}">
       <div>${i.popular?`<span class="badge">${lang==="ar"?"الأكثر طلباً":"POPULAR"}</span>`:""}<h3>${t(i)}</h3><div class="en">${lang==="ar"?i.en:i.ar}</div><p class="desc">${lang==="ar"?i.descAr:i.descEn}</p>${sh?`<div class="flavor-hint">${lang==="ar"?"12 نكهة متاحة — اضغط للاختيار":"12 flavors available — tap to choose"}</div>`:""}</div>
       <div class="price-row"><span class="price">${money(i.price)}</span><button class="add" onclick="addItem('${i.id}')">+</button></div></article>`;
   }); out+=`</div></section>`;
 });
 $("menu").innerHTML=out||`<div class="empty">${lang==="ar"?"لا توجد نتائج":"No results"}</div>`;
 updateCart();
}
function addItem(id){const item=DATA.items.find(x=>x.id===id);if(!item)return;if(item.cat==="shisha"){openShisha(item);return}const found=cartItems.find(x=>x.id===id&&!x.flavor);if(found)found.qty++;else cartItems.push({id,qty:1,name:item.ar,price:item.price});updateCart();toast(lang==="ar"?"تمت الإضافة للسلة":"Added to cart")}
function openShisha(item){shishaItem=item;selectedType=DATA.shishaOptions.types.find(x=>x.id===item.shishaType)||DATA.shishaOptions.types[0];selectedFlavor=null;renderShisha();$("shishaOverlay").classList.add("open")}
function renderShisha(){
 $("typeRow").innerHTML=DATA.shishaOptions.types.map(x=>`<button class="type ${selectedType&&selectedType.id===x.id?"selected":""}" onclick="selectType('${x.id}')"><b>${t(x)}</b><small>${money(x.price)} — ${lang==="ar"?x.descAr:x.descEn}</small></button>`).join("");
 const allowed=shishaItem.flavors||DATA.shishaOptions.flavors.map(x=>x.id);$("flavorGrid").innerHTML=DATA.shishaOptions.flavors.filter(x=>allowed.includes(x.id)).map(x=>`<button class="flavor ${selectedFlavor===x.id?"selected":""}" onclick="selectFlavor('${x.id}')">${t(x)}</button>`).join("");
}
function selectType(id){selectedType=DATA.shishaOptions.types.find(x=>x.id===id);renderShisha()}
function selectFlavor(id){selectedFlavor=id;renderShisha()}
function addShisha(){if(!selectedType||!selectedFlavor){toast(lang==="ar"?"اختر النوع والنكهة أولاً":"Choose a type and flavor first");return}const fl=DATA.shishaOptions.flavors.find(x=>x.id===selectedFlavor);const key=`shisha-${selectedType.id}-${selectedFlavor}`;const found=cartItems.find(x=>x.key===key);if(found)found.qty++;else cartItems.push({key,id:shishaItem.id,qty:1,name:selectedType.ar,price:selectedType.price,flavor:fl.ar,flavorEn:fl.en,typeEn:selectedType.en});$("shishaOverlay").classList.remove("open");updateCart();toast(lang==="ar"?"تمت إضافة الأرجيلة":"Shisha added")}
function updateCart(){const count=cartItems.reduce((s,x)=>s+x.qty,0),total=cartItems.reduce((s,x)=>s+x.price*x.qty,0);$("cart").classList.toggle("show",count>0);$("cartText").textContent=lang==="ar"?`السلة (${count})`:`Cart (${count})`;$("cartTotal").textContent=money(total);renderCart()}
function renderCart(){const box=$("cartItems");if(!box)return;box.innerHTML=cartItems.length?cartItems.map((x,i)=>`<div class="row"><div><b>${lang==="ar"?x.name:x.typeEn||x.name}</b>${x.flavor?`<small>${lang==="ar"?"النكهة: "+x.flavor:"Flavor: "+x.flavorEn}</small>`:""}</div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${i},1)">+</button></div></div>`).join(""):`<div class="empty">${lang==="ar"?"السلة فارغة":"Cart is empty"}</div>`;const total=cartItems.reduce((s,x)=>s+x.price*x.qty,0);$("total").textContent=money(total)}
function changeQty(i,d){cartItems[i].qty+=d;if(cartItems[i].qty<=0)cartItems.splice(i,1);updateCart()}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>$("toast").classList.remove("show"),1600)}
$("search").addEventListener("input",render);$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lang").textContent=lang==="ar"?"English":"العربية";$("search").placeholder=lang==="ar"?"ابحث عن صنف أو نكهة...":"Search item or flavor...";renderCats();render()};$("cart").onclick=()=>$("overlay").classList.add("open");$("close").onclick=()=>$("overlay").classList.remove("open");$("cancelShisha").onclick=()=>$("shishaOverlay").classList.remove("open");$("addShisha").onclick=addShisha;$("send").onclick=()=>toast(lang==="ar"?"تم تجهيز الطلب — اربط الإرسال بواتساب/النظام لاحقاً":"Order ready — connect sending to WhatsApp/system later");init();
</script>
</body></html>
