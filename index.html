<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><meta name="description" content="OLV Luxury Café & Restaurant — Digital Menu"><title>OLV — Luxury Café & Restaurant</title>
<style>
:root{--bg:#050505;--panel:#11100e;--panel2:#17140f;--gold:#cba250;--gold2:#f2d27f;--cream:#fbf5e9;--muted:#a59c8d;--line:#302a20;--green:#2f7742}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -5%,#2b2115 0,#0b0a08 34%,#050505 72%);color:var(--cream);font-family:Arial,"Noto Sans Arabic",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:0 15px 125px}
/* Welcome */
.welcome{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 35%,#251b10 0,#0b0907 42%,#030303 78%);display:flex;align-items:center;justify-content:center;overflow:hidden}.welcome::before,.welcome::after{content:"";position:absolute;border-radius:50%;pointer-events:none}.welcome::before{width:70vw;height:70vw;max-width:700px;max-height:700px;background:radial-gradient(circle,rgba(242,210,127,.13),rgba(242,210,127,0) 68%);filter:blur(5px);animation:pulse 4.5s ease-in-out infinite}.welcome::after{width:120%;height:2px;background:linear-gradient(90deg,transparent,rgba(242,210,127,.7),transparent);transform:translateX(-120%);animation:sweep 4.8s 1s ease-in-out infinite}.welcome-card{width:min(94vw,900px);text-align:center;position:relative;z-index:2;padding:25px 18px 28px}.welcome-logo{display:block;width:min(92vw,760px);max-height:72vh;height:auto;object-fit:contain;margin:auto;filter:drop-shadow(0 16px 34px rgba(0,0,0,.65));animation:logoIn 1.3s cubic-bezier(.2,.8,.2,1) both}.welcome-line{width:min(340px,70vw);height:1px;margin:15px auto 14px;background:linear-gradient(90deg,transparent,#cba250,transparent);opacity:.8}.welcome-copy{color:#d8c7a6;font-size:13px;letter-spacing:1.8px;opacity:0;animation:fadeUp .9s .55s ease forwards}.welcome-button{margin-top:23px;opacity:0;animation:fadeUp .9s .9s ease forwards;background:linear-gradient(135deg,#a47a37,#f0cd78);border:1px solid #f2d27f;color:#181208;border-radius:16px;padding:14px 30px;font-weight:900;font-size:15px;box-shadow:0 12px 35px rgba(0,0,0,.45)}.welcome.hidden{animation:hideWelcome .65s ease forwards}.welcome.hidden .welcome-card{animation:scaleOut .65s ease forwards}
@keyframes logoIn{from{opacity:0;transform:scale(.9) translateY(20px);filter:blur(5px) drop-shadow(0 16px 34px rgba(0,0,0,.65))}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0) drop-shadow(0 16px 34px rgba(0,0,0,.65))}}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.08);opacity:1}}@keyframes sweep{0%{transform:translateX(-120%)}65%,100%{transform:translateX(120%)}}@keyframes hideWelcome{to{opacity:0;visibility:hidden;pointer-events:none}}@keyframes scaleOut{to{transform:scale(1.02)}}
/* Main */
.hero{padding:16px 0 14px}.hero-card{position:relative;overflow:hidden;border:1px solid #4e3d25;border-radius:28px;padding:18px;background:linear-gradient(145deg,rgba(29,24,17,.96),rgba(8,8,8,.98));box-shadow:0 30px 100px rgba(0,0,0,.6)}.hero-card::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,rgba(242,210,127,.055),transparent 55%);pointer-events:none}.brand{position:relative;text-align:center}.header-logo{width:min(88%,620px);max-height:240px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}.brand-sub{margin:4px 0 0;color:#cdbb92;font-size:12px;letter-spacing:2.5px}.hero-pills{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{padding:7px 12px;border:1px solid #4e3d25;border-radius:999px;background:#15110c;color:#dcc28c;font-size:10px}
.toolbar{position:sticky;top:0;z-index:30;padding:10px 0 7px;background:linear-gradient(#050505 75%,transparent);backdrop-filter:blur(14px)}.toolbar-top{display:flex;gap:8px}.search{flex:1;background:#101010;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:#fff;outline:0;font-size:15px}.lang{background:#17120b;color:var(--gold2);border:1px solid #67512f;border-radius:14px;padding:12px 14px;font-weight:800}.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 7px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;background:#111;color:#b3ab9d;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:14px}.cat.active{background:linear-gradient(135deg,#d8b15e,#a47a35);border-color:#dfbb6c;color:#171108;font-weight:900}
.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 3px 12px}.section-head h2{margin:0;color:var(--gold2);font:700 27px Georgia,serif}.section-head span{color:#81786a;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{position:relative;min-height:200px;padding:18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#171717,#0d0d0d);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.item::after{content:"";position:absolute;width:150px;height:150px;left:-70px;bottom:-70px;border-radius:50%;background:rgba(203,162,80,.05)}.item.shisha{border-color:#5a472b;background:linear-gradient(145deg,#1a1610,#0d0d0d)}.item.unavailable{opacity:.45}.badge{display:inline-block;background:var(--gold2);color:#181207;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;margin-bottom:9px}.unavailable-badge{display:inline-block;background:#3b2828;color:#eee;border:1px solid #5d3737;border-radius:999px;padding:6px 9px;font-size:10px;margin-bottom:9px}.item h3{margin:0 0 5px;font-size:20px;line-height:1.25}.en{font-size:12px;color:#aaa294;direction:ltr;text-align:right}.desc{font-size:14px;line-height:1.75;color:#938d82;margin:10px 0 11px}.price-row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.price{color:var(--gold2);font-weight:900;font-size:17px}.add{width:46px;height:46px;border-radius:14px;background:#21190d;color:var(--gold2);border:1px solid #765b30;font-size:25px}.add:disabled{opacity:.45;cursor:not-allowed}.shisha-hint{color:#c5a971;font-size:11px;margin-top:5px}.empty{text-align:center;padding:45px;color:#777;font-size:14px}
.cart{position:fixed;z-index:40;left:14px;right:14px;bottom:14px;max-width:940px;margin:auto;display:none;align-items:center;justify-content:space-between;border:1px solid #d7ae5b;border-radius:18px;padding:15px 18px;background:linear-gradient(100deg,#9d7432,#ebca74);color:#171008;box-shadow:0 20px 55px rgba(0,0,0,.65);font-weight:900}.cart.show{display:flex}.cart-total{font-size:15px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.84);display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:94vh;overflow:auto;background:linear-gradient(#121212,#090909);border-top:1px solid #4d3b23;border-radius:29px 29px 0 0;padding:22px}.sheet-inner{max-width:760px;margin:auto}.sheet h2{margin:0 0 15px;color:var(--gold2);font:700 28px Georgia,serif}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:#847c72;font-size:11px;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:9px;border:1px solid #37342e;background:#1b1b1b;color:#fff}.total{display:flex;justify-content:space-between;padding:19px 0;color:var(--gold2);font-size:22px;font-weight:900}.mode-title{font-size:13px;color:#9a9185;margin:2px 0 9px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{background:#171717;border:1px solid #34312b;border-radius:16px;padding:15px;color:#ddd;text-align:right}.mode.selected{border-color:var(--gold);background:#241c10;box-shadow:inset 0 0 0 1px #6d532b}.mode b{display:block;color:var(--gold2);margin-bottom:5px;font-size:16px}.mode small{color:#8c857a;font-size:11px}.field{width:100%;background:#171717;border:1px solid #302d28;color:#fff;border-radius:12px;padding:13px;margin:6px 0;outline:0;font-size:14px}.field:focus{border-color:#806337}.notice{background:#17130d;border:1px solid #443521;border-radius:12px;color:#c8b991;font-size:11px;line-height:1.7;padding:11px 12px;margin:8px 0}.primary,.whatsapp,.secondary{width:100%;border-radius:14px;padding:14px;margin-top:8px;font-weight:900;font-size:14px}.primary{background:linear-gradient(135deg,#ae853e,#e8c673);border:0;color:#171008}.whatsapp{background:#173720;border:1px solid #397049;color:#effff2}.secondary{background:#171717;border:1px solid #34312b;color:#ddd}.flavor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.flavor{background:#171717;border:1px solid #302d27;color:#ddd;border-radius:12px;padding:12px 7px;font-size:12px}.flavor.selected{border-color:var(--gold);background:#251c0e;color:var(--gold2)}.type-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.type{background:#171717;border:1px solid #34312b;border-radius:15px;color:#ddd;padding:13px;text-align:right}.type.selected{border-color:var(--gold);background:#251c0e}.type b{display:block;color:var(--gold2);margin-bottom:4px}.type small{font-size:10px;color:#888}.toast{position:fixed;z-index:120;left:50%;bottom:86px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#eee;color:#111;padding:11px 14px;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.grid{grid-template-columns:1fr}.header-logo{max-height:220px}.item{min-height:170px}.item h3{font-size:19px}.desc{font-size:13px}.cat{font-size:13px;padding:9px 13px}.section-head h2{font-size:24px}.welcome-logo{width:96vw;max-height:62vh}.welcome-copy{font-size:11px;letter-spacing:1.3px}.welcome-button{font-size:14px;padding:13px 26px}}
</style>
</head>
<body>
<div id="welcome" class="welcome"><div class="welcome-card"><img class="welcome-logo" src="assets/olv-original.jpg" alt="OLV Luxury Café & Restaurant"><div class="welcome-line"></div><div class="welcome-copy">LUXURY CAFÉ &amp; RESTAURANT</div><button class="welcome-button" id="enterWelcome">الدخول إلى الطلب</button></div></div>
<div class="wrap"><header class="hero"><div class="hero-card"><div class="brand"><img class="header-logo" src="assets/olv-original.jpg" alt="OLV Luxury Café & Restaurant"><div class="brand-sub">LUXURY CAFÉ &amp; RESTAURANT</div><div class="hero-pills"><span class="pill">قائمة رقمية</span><span class="pill">طلب داخل الصالة</span><span class="pill">توصيل</span></div></div></div></header>
<div class="toolbar"><div class="toolbar-top"><input id="search" class="search" placeholder="ابحث عن صنف أو نكهة..." autocomplete="off"><button id="lang" class="lang">English</button></div><div id="cats" class="cats"></div></div><main id="menu"></main></div>
<button id="cart" class="cart"><span id="cartText">السلة</span><span id="cartTotal" class="cart-total"></span></button><div id="toast" class="toast"></div>
<div id="orderOverlay" class="overlay"><div class="sheet"><div class="sheet-inner"><h2 id="orderTitle">طلبك</h2><div id="cartItems"></div><div class="total"><span id="totalLabel">المجموع</span><span id="total"></span></div><div class="mode-title" id="modeTitle">طريقة الطلب</div><div class="modes"><button class="mode selected" data-mode="hall" onclick="selectMode('hall')"><b id="hallLabel">صالة</b><small id="hallHint">الطلب داخل الكافيه</small></button><button class="mode" data-mode="delivery" onclick="selectMode('delivery')"><b id="deliveryLabel">توصيل</b><small id="deliveryHint">الطلب إلى موقعك</small></button></div><div id="hallFields"><input id="table" class="field" inputmode="numeric" placeholder="رقم الطاولة"></div><div id="deliveryFields" style="display:none"><input id="customerPhone" class="field" type="tel" placeholder="رقم الهاتف"><textarea id="address" class="field" rows="2" placeholder="عنوان التوصيل"></textarea></div><textarea id="notes" class="field" rows="2" placeholder="ملاحظات على الطلب"></textarea><div id="notice" class="notice">اختر صالة أو توصيل وأكمل البيانات المطلوبة قبل إرسال الطلب.</div><button id="whatsapp" class="whatsapp">إرسال الطلب عبر واتساب</button><button id="copy" class="primary">نسخ الطلب</button><button id="closeOrder" class="secondary">متابعة التصفح</button></div></div></div>
<div id="shishaOverlay" class="overlay"><div class="sheet"><div class="sheet-inner"><h2 id="shishaTitle">اختَر الأرجيلة</h2><div id="typeRow" class="type-row"></div><div class="shisha-hint" id="flavorHint">ثم اختَر النكهة</div><div id="flavorGrid" class="flavor-grid"></div><button id="addShisha" class="primary">إضافة للسلة</button><button id="cancelShisha" class="secondary">إلغاء</button></div></div></div>
<script>
let DATA=null,lang='ar',active='all',cartItems=[],orderMode=null,shishaItem=null,selectedType=null,selectedFlavor=null;
const $=id=>document.getElementById(id),money=n=>`${Number(n).toFixed(2)} JD`,tx=x=>x[lang];
async function init(){DATA=await fetch('data/menu.json',{cache:'no-store'}).then(r=>r.json());renderCats();render()}
function renderCats(){const all={id:'all',ar:'الكل',en:'All'};$('cats').innerHTML=[all,...DATA.categories].map(c=>`<button class="cat ${active===c.id?'active':''}" onclick="setCat('${c.id}')">${tx(c)}</button>`).join('')}
function setCat(c){active=c;renderCats();render();scrollTo({top:0,behavior:'smooth'})}
function render(){const q=$('search').value.trim().toLowerCase();const cats=active==='all'?DATA.categories:DATA.categories.filter(c=>c.id===active);let html='';cats.forEach(c=>{let items=active==='all'&&c.id==='popular'?DATA.items.filter(i=>i.popular):DATA.items.filter(i=>i.cat===c.id);if(q)items=items.filter(i=>(i.ar+' '+i.en+' '+(i.descAr||'')+' '+(i.descEn||'')).toLowerCase().includes(q));if(!items.length)return;html+=`<section class="section"><div class="section-head"><h2>${tx(c)}</h2><span>${items.length} ${lang==='ar'?'أصناف':'items'}</span></div><div class="grid">`;items.forEach(i=>{const ok=i.available!==false,sh=i.cat==='shisha';html+=`<article class="item ${sh?'shisha':''} ${ok?'':'unavailable'}"><div>${i.popular?`<span class="badge">${lang==='ar'?'الأكثر طلباً':'POPULAR'}</span>`:''}${!ok?`<span class="unavailable-badge">${lang==='ar'?'غير متوفر حالياً':'UNAVAILABLE'}</span>`:''}<h3>${tx(i)}</h3><div class="en">${lang==='ar'?i.en:i.ar}</div><p class="desc">${lang==='ar'?i.descAr:i.descEn}</p>${sh&&ok?`<div class="shisha-hint">${lang==='ar'?'اختر النوع والنكهة قبل الإضافة':'Choose style and flavor'}</div>`:''}</div><div class="price-row"><span class="price">${ok?money(i.price):(lang==='ar'?'غير متوفر':'Unavailable')}</span><button class="add" ${ok?'':'disabled'} onclick="addItem('${i.id}')">+</button></div></article>`});html+='</div></section>'});$('menu').innerHTML=html||`<div class="empty">${lang==='ar'?'لا توجد نتائج':'No results'}</div>`;updateCart()}
function addItem(id){const i=DATA.items.find(x=>x.id===id);if(!i||i.available===false)return;if(i.cat==='shisha'){openShisha(i);return}const found=cartItems.find(x=>x.id===id&&!x.flavor);if(found)found.qty++;else cartItems.push({id,qty:1,key:id,price:i.price});updateCart();showToast(lang==='ar'?'تمت الإضافة للسلة':'Added to cart')}
function openShisha(i){shishaItem=i;selectedType=DATA.shishaOptions.types.find(x=>x.id===i.shishaType)||DATA.shishaOptions.types[0];selectedFlavor=null;renderShisha();$('shishaOverlay').classList.add('open')}
function renderShisha(){$('typeRow').innerHTML=DATA.shishaOptions.types.map(x=>`<button class="type ${selectedType&&selectedType.id===x.id?'selected':''}" onclick="selectType('${x.id}')"><b>${tx(x)}</b><small>${money(x.price)} — ${lang==='ar'?x.descAr:x.descEn}</small></button>`).join('');const allowed=shishaItem.flavors||DATA.shishaOptions.flavors.map(x=>x.id);$('flavorGrid').innerHTML=DATA.shishaOptions.flavors.filter(x=>allowed.includes(x.id)).map(x=>`<button class="flavor ${selectedFlavor===x.id?'selected':''}" onclick="selectFlavor('${x.id}')">${tx(x)}</button>`).join('')}
function selectType(id){selectedType=DATA.shishaOptions.types.find(x=>x.id===id);renderShisha()}function selectFlavor(id){selectedFlavor=id;renderShisha()}
function addShisha(){if(!selectedType||!selectedFlavor){showToast(lang==='ar'?'اختَر النوع والنكهة أولاً':'Choose style and flavor first');return}const fl=DATA.shishaOptions.flavors.find(x=>x.id===selectedFlavor);const key=`${shishaItem.id}|${selectedType.id}|${fl.id}`;const f=cartItems.find(x=>x.key===key);if(f)f.qty++;else cartItems.push({id:shishaItem.id,qty:1,key,price:selectedType.price,label:`${selectedType.ar} — ${fl.ar}`,labelEn:`${selectedType.en} — ${fl.en}`,flavor:fl.ar,flavorEn:fl.en});$('shishaOverlay').classList.remove('open');updateCart();showToast(lang==='ar'?'تمت إضافة الأرجيلة للسلة':'Shisha added')}
function updateCart(){const n=cartItems.reduce((a,x)=>a+x.qty,0),total=cartItems.reduce((a,x)=>a+x.price*x.qty,0);$('cart').classList.toggle('show',n>0);$('cartText').textContent=lang==='ar'?`السلة • ${n} صنف`:`Cart • ${n} items`;$('cartTotal').textContent=money(total)}
function renderCart(){let total=0;$('cartItems').innerHTML=cartItems.length?cartItems.map((x,i)=>{const item=DATA.items.find(a=>a.id===x.id);total+=x.price*x.qty;const name=x.label?(lang==='ar'?x.label:x.labelEn):tx(item);return `<div class="row"><div><b>${name}</b>${x.flavor?`<small>${lang==='ar'?'النكهة: '+x.flavor:'Flavor: '+x.flavorEn}</small>`:''}<small>${money(x.price)} × ${x.qty}</small></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`}).join(''):`<div class="empty">${lang==='ar'?'السلة فارغة':'Cart is empty'}</div>`;$('total').textContent=money(total)}
function changeQty(i,d){cartItems[i].qty+=d;if(cartItems[i].qty<=0)cartItems.splice(i,1);updateCart();if($('orderOverlay').classList.contains('open'))renderCart()}
function selectMode(mode){orderMode=mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));$('hallFields').style.display=mode==='hall'?'block':'none';$('deliveryFields').style.display=mode==='delivery'?'block':'none'}
function getOrder(){if(!cartItems.length)return null;if(!orderMode){showToast(lang==='ar'?'اختر طريقة الطلب أولاً':'Choose an order method first');return null}let destination;if(orderMode==='hall'){const table=$('table').value.trim();if(!table){showToast(lang==='ar'?'أدخل رقم الطاولة أولاً':'Enter the table number first');return null}destination=lang==='ar'?`صالة — طاولة ${table}`:`Hall — Table ${table}`}else{const phone=$('customerPhone').value.trim(),address=$('address').value.trim();if(!phone||!address){showToast(lang==='ar'?'أدخل الهاتف والعنوان أولاً':'Enter phone and address first');return null}destination=lang==='ar'?`توصيل — ${address} — ${phone}`:`Delivery — ${address} — ${phone}`}let lines=cartItems.map(x=>`${x.qty} × ${x.label?(lang==='ar'?x.label:x.labelEn):tx(DATA.items.find(a=>a.id===x.id))}`).join('\n');const total=cartItems.reduce((a,x)=>a+x.price*x.qty,0);let text=`OLV — ${lang==='ar'?'طلب جديد':'New Order'}\n\n${destination}\n\n${lines}\n\n${lang==='ar'?'المجموع':'Total'}: ${money(total)}`;const notes=$('notes').value.trim();if(notes)text+=`\n\n${lang==='ar'?'ملاحظات':'Notes'}: ${notes}`;return{text,total}}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
function showToast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.remove('show'),1600)}
$('enterWelcome').onclick=()=>{$('welcome').classList.add('hidden');setTimeout(()=>{ $('welcome').style.display='none'; $('orderOverlay').classList.add('open');selectMode('hall');},600)}
$('search').oninput=render;$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='ar'?'English':'العربية';$('search').placeholder=lang==='ar'?'ابحث عن صنف أو نكهة...':'Search item or flavor...';$('orderTitle').textContent=lang==='ar'?'طلبك':'Your Order';$('totalLabel').textContent=lang==='ar'?'المجموع':'Total';$('modeTitle').textContent=lang==='ar'?'طريقة الطلب':'Order method';$('hallLabel').textContent=lang==='ar'?'صالة':'Hall';$('hallHint').textContent=lang==='ar'?'الطلب داخل الكافيه':'Dine-in order';$('deliveryLabel').textContent=lang==='ar'?'توصيل':'Delivery';$('deliveryHint').textContent=lang==='ar'?'الطلب إلى موقعك':'Deliver to your location';$('notice').textContent=lang==='ar'?'اختر صالة أو توصيل وأكمل البيانات المطلوبة قبل إرسال الطلب.':'Choose Hall or Delivery and complete the required details before sending.';$('whatsapp').textContent=lang==='ar'?'إرسال الطلب عبر واتساب':'Send order via WhatsApp';$('copy').textContent=lang==='ar'?'نسخ الطلب':'Copy order';$('closeOrder').textContent=lang==='ar'?'متابعة التصفح':'Continue browsing';renderCats();render();if($('orderOverlay').classList.contains('open'))renderCart();if($('shishaOverlay').classList.contains('open'))renderShisha()};
$('cart').onclick=()=>{$('orderOverlay').classList.add('open');if(!orderMode)orderMode='hall';renderCart()};$('closeOrder').onclick=()=>$('orderOverlay').classList.remove('open');$('cancelShisha').onclick=()=>$('shishaOverlay').classList.remove('open');$('orderOverlay').onclick=e=>{if(e.target===$('orderOverlay'))$('orderOverlay').classList.remove('open')};$('shishaOverlay').onclick=e=>{if(e.target===$('shishaOverlay'))$('shishaOverlay').classList.remove('open')};$('addShisha').onclick=addShisha;
$('whatsapp').onclick=()=>{const o=getOrder();if(!o)return;let n=(DATA.settings.whatsappNumber||'').replace(/\D/g,'');if(n.startsWith('0'))n='962'+n.slice(1);if(!n){copyText(o.text);showToast(lang==='ar'?'رقم واتساب غير مضبوط — تم نسخ الطلب':'WhatsApp number not configured — order copied');return}window.open(`https://wa.me/${n}?text=${encodeURIComponent(o.text)}`,'_blank')};$('copy').onclick=async()=>{const o=getOrder();if(!o)return;await copyText(o.text);showToast(lang==='ar'?'تم نسخ الطلب':'Order copied')};
init();
</script>
</body></html>
