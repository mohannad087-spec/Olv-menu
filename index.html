<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content="OLV Luxury Café & Restaurant — Digital Menu">
<title>OLV — Luxury Café & Restaurant</title>
<style>
:root{--bg:#060606;--panel:#101010;--panel2:#15130f;--gold:#c9a24f;--gold2:#f1d17f;--text:#f6f0e4;--muted:#989184;--line:#2b2822;--green:#2d6a3b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#302617 0,#0b0b0b 35%,#050505 75%);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:0 16px 125px}
.hero{padding:18px 0 12px}.hero-card{position:relative;overflow:hidden;border:1px solid #4b3b22;border-radius:28px;padding:24px 18px 22px;background:linear-gradient(145deg,rgba(27,23,17,.98),rgba(8,8,8,.98));box-shadow:0 30px 100px rgba(0,0,0,.6)}.hero-card:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,220,130,.045) 50%,transparent 80%);pointer-events:none}.brand{text-align:center;position:relative;z-index:1}.logo{display:block;width:min(92%,620px);height:auto;max-height:270px;object-fit:contain;margin:0 auto 5px;border:0;border-radius:0;background:transparent;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}.brand-sub{margin:2px 0 0;color:#cdbb91;font-size:12px;letter-spacing:2px}.hero-pills{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:16px}.pill{padding:7px 11px;border:1px solid #4b3b24;border-radius:999px;background:#15110b;color:#d9c18d;font-size:10px}
.toolbar{position:sticky;top:0;z-index:20;padding:10px 0 7px;background:linear-gradient(#060606 72%,transparent);backdrop-filter:blur(14px)}.toolbar-top{display:flex;gap:8px}.search{flex:1;background:#101010;border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:#fff;outline:0}.search:focus{border-color:#826633}.lang{background:#171209;color:var(--gold2);border:1px solid #67502d;border-radius:14px;padding:11px 13px;font-weight:700}.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 7px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;background:#101010;color:#aaa;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:11px}.cat.active{background:linear-gradient(135deg,#d9b35f,#9b7131);border-color:#d9b35f;color:#17120a;font-weight:800}
.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 3px 11px}.section-head h2{margin:0;color:var(--gold2);font:700 24px Georgia,serif}.section-head span{color:#777;font-size:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.item{position:relative;min-height:190px;padding:17px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#171717,#0d0d0d);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.18s}.item:before{content:"";position:absolute;width:130px;height:130px;left:-65px;bottom:-65px;border-radius:50%;background:rgba(201,162,79,.055)}.item:hover{transform:translateY(-2px);border-color:#574529}.item.shisha{border-color:#59462a;background:linear-gradient(145deg,#19150f,#0d0d0d)}.badge{display:inline-block;background:var(--gold2);color:#181208;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;margin-bottom:8px}.unavailable{opacity:.48}.unavailable-badge{display:inline-block;background:#392626;color:#eee;border:1px solid #5c3737;border-radius:999px;padding:5px 8px;font-size:9px;margin-bottom:8px}.item h3{margin:0 0 4px;font-size:17px}.en{font-size:10px;color:#a9a39a;direction:ltr;text-align:right}.desc{font-size:11px;line-height:1.7;color:#89847b;margin:9px 0 10px}.price-row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.price{color:var(--gold2);font-weight:800}.add{width:44px;height:44px;border-radius:14px;background:#21190d;color:var(--gold2);border:1px solid #765c31;font-size:24px}.add:disabled{opacity:.4;cursor:not-allowed}.shisha-hint{color:#c4aa73;font-size:10px;margin-top:5px}
.cart{position:fixed;z-index:40;left:14px;right:14px;bottom:14px;max-width:920px;margin:auto;display:none;align-items:center;justify-content:space-between;border:1px solid #d7ae5b;border-radius:18px;padding:14px 17px;background:linear-gradient(100deg,#9c7433,#ebc975);color:#171109;box-shadow:0 20px 55px rgba(0,0,0,.65);font-weight:800}.cart.show{display:flex}.cart small{display:block;font-weight:600;opacity:.65}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:93vh;overflow:auto;background:linear-gradient(#121212,#0b0b0b);border-top:1px solid #4f3c22;border-radius:28px 28px 0 0;padding:21px;box-shadow:0 -25px 90px #000}.sheet-inner{max-width:720px;margin:auto}.sheet h2{margin:0 0 15px;color:var(--gold2);font:700 27px Georgia,serif}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:#858078;font-size:10px;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:9px;border:1px solid #38352e;background:#1b1b1b;color:#fff}.total{display:flex;justify-content:space-between;padding:18px 0;color:var(--gold2);font-size:20px;font-weight:800}.mode-title{font-size:11px;color:#8e887e;margin:2px 0 7px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{background:#171717;border:1px solid #34312b;border-radius:16px;padding:14px;color:#ddd;text-align:right}.mode.selected{border-color:var(--gold);background:#241c10;box-shadow:inset 0 0 0 1px #70552c}.mode b{display:block;color:var(--gold2);margin-bottom:4px}.mode small{color:#89837a;font-size:10px}.field{width:100%;background:#171717;border:1px solid #302d28;color:#fff;border-radius:12px;padding:12px;margin:6px 0;outline:0}.field:focus{border-color:#7d6031}.notice{background:#17130d;border:1px solid #443521;border-radius:12px;color:#c8b68e;font-size:10px;line-height:1.6;padding:10px 12px;margin:8px 0}.primary,.whatsapp,.secondary{width:100%;border-radius:13px;padding:14px;margin-top:8px;font-weight:800}.primary{background:linear-gradient(135deg,#ad8237,#e6c36e);border:0;color:#171109}.whatsapp{background:#17351f;border:1px solid #376d45;color:#ecfff0}.secondary{background:#171717;border:1px solid #333;color:#ddd}.flavor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.flavor{background:#171717;border:1px solid #302d27;color:#ddd;border-radius:12px;padding:11px 6px;font-size:11px}.flavor.selected{border-color:var(--gold);background:#251c0e;color:var(--gold2)}.type-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.type{background:#171717;border:1px solid #34312b;border-radius:15px;color:#ddd;padding:12px;text-align:right}.type.selected{border-color:var(--gold);background:#251c0e}.type b{display:block;color:var(--gold2);margin-bottom:4px}.type small{font-size:9px;color:#888}.toast{position:fixed;z-index:90;left:50%;bottom:84px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#eee;color:#111;padding:10px 14px;border-radius:12px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.grid{grid-template-columns:1fr}.logo{max-height:230px}.item{min-height:165px}.flavor-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<div class="wrap"><header class="hero"><div class="hero-card"><div class="brand"><img class="logo" src="assets/olv-logo.svg" alt="OLV Luxury Café & Restaurant"><div class="brand-sub">LUXURY CAFÉ &amp; RESTAURANT</div><div class="hero-pills"><span class="pill">قائمة رقمية</span><span class="pill">طلب داخل الصالة</span><span class="pill">توصيل</span></div></div></div></header>
<div class="toolbar"><div class="toolbar-top"><input id="search" class="search" placeholder="ابحث عن صنف أو نكهة..." autocomplete="off"><button id="lang" class="lang">English</button></div><div id="cats" class="cats"></div></div><main id="menu"></main></div>
<button id="cart" class="cart"><span id="cartText">السلة</span><span id="cartTotal"></span></button><div id="toast" class="toast"></div>
<div id="orderOverlay" class="overlay"><div class="sheet"><div class="sheet-inner"><h2 id="orderTitle">طلبك</h2><div id="cartItems"></div><div class="total"><span id="totalLabel">المجموع</span><span id="total"></span></div><div class="mode-title" id="modeTitle">اختر طريقة الطلب</div><div class="modes"><button class="mode selected" data-mode="hall" onclick="selectMode('hall')"><b id="hallLabel">صالة</b><small id="hallHint">الطلب داخل الكافيه</small></button><button class="mode" data-mode="delivery" onclick="selectMode('delivery')"><b id="deliveryLabel">توصيل</b><small id="deliveryHint">الطلب إلى موقعك</small></button></div><div id="hallFields"><input id="table" class="field" placeholder="رقم الطاولة"></div><div id="deliveryFields" style="display:none"><input id="customerPhone" class="field" type="tel" placeholder="رقم الهاتف"><textarea id="address" class="field" rows="2" placeholder="عنوان التوصيل"></textarea></div><textarea id="notes" class="field" rows="2" placeholder="ملاحظات على الطلب"></textarea><div id="notice" class="notice">اختر صالة أو توصيل وأكمل البيانات المطلوبة قبل إرسال الطلب.</div><button id="whatsapp" class="whatsapp">إرسال الطلب عبر واتساب</button><button id="copy" class="primary">نسخ الطلب</button><button id="closeOrder" class="secondary">متابعة التصفح</button></div></div></div>
<div id="shishaOverlay" class="overlay"><div class="sheet"><div class="sheet-inner"><h2 id="shishaTitle">اختَر الأرجيلة</h2><div id="typeRow" class="type-row"></div><div class="shisha-hint" id="flavorHint">ثم اختَر النكهة</div><div id="flavorGrid" class="flavor-grid"></div><button id="addShisha" class="primary">إضافة للسلة</button><button id="cancelShisha" class="secondary">إلغاء</button></div></div></div>
<script>
let DATA=null,lang='ar',active='all',cartItems=[],orderMode='hall',shishaItem=null,selectedType=null,selectedFlavor=null;
const $=id=>document.getElementById(id),money=n=>`${Number(n).toFixed(2)} JD`,txt=x=>x[lang];
async function init(){try{DATA=await fetch('data/menu.json',{cache:'no-store'}).then(r=>r.json());renderCats();render()}catch(e){$('menu').innerHTML='<div class="notice">تعذر تحميل المنيو.</div>'}}
function renderCats(){const all={id:'all',ar:'الكل',en:'All'};$('cats').innerHTML=[all,...DATA.categories].map(c=>`<button class="cat ${active===c.id?'active':''}" onclick="setCat('${c.id}')">${txt(c)}</button>`).join('')}
function setCat(c){active=c;renderCats();render();scrollTo({top:0,behavior:'smooth'})}
function render(){const q=$('search').value.trim().toLowerCase();const cats=active==='all'?DATA.categories:DATA.categories.filter(c=>c.id===active);let html='';cats.forEach(c=>{let items=active==='all'&&c.id==='popular'?DATA.items.filter(i=>i.popular):DATA.items.filter(i=>i.cat===c.id);if(q)items=items.filter(i=>(i.ar+' '+i.en+' '+(i.descAr||'')+' '+(i.descEn||'')).toLowerCase().includes(q));if(!items.length)return;html+=`<section class="section"><div class="section-head"><h2>${txt(c)}</h2><span>${items.length} ${lang==='ar'?'أصناف':'items'}</span></div><div class="grid">`;items.forEach(i=>{const ok=i.available!==false,sh=i.cat==='shisha';html+=`<article class="item ${sh?'shisha':''} ${ok?'':'unavailable'}"><div>${i.popular?`<span class="badge">${lang==='ar'?'الأكثر طلباً':'POPULAR'}</span>`:''}${!ok?`<span class="unavailable-badge">${lang==='ar'?'غير متوفر حالياً':'UNAVAILABLE'}</span>`:''}<h3>${txt(i)}</h3><div class="en">${lang==='ar'?i.en:i.ar}</div><p class="desc">${lang==='ar'?i.descAr:i.descEn}</p>${sh&&ok?`<div class="shisha-hint">${lang==='ar'?'12 نكهة متاحة — اضغط للاختيار':'12 flavors — tap to choose'}</div>`:''}</div><div class="price-row"><span class="price">${money(i.price)}</span><button class="add" ${ok?'':'disabled'} onclick="addItem('${i.id}')">+</button></div></article>`});html+='</div></section>'});$('menu').innerHTML=html||`<div class="notice">${lang==='ar'?'لا توجد نتائج':'No results'}</div>`;updateCart()}
function addItem(id){const i=DATA.items.find(x=>x.id===id);if(!i||i.available===false)return;if(i.cat==='shisha'){openShisha(i);return}let q=cartItems.find(x=>x.id===id&&!x.flavor);if(q)q.qty++;else cartItems.push({id,qty:1,price:i.price,name:i.ar,nameEn:i.en,key:id});updateCart();toast(lang==='ar'?'تمت الإضافة للسلة':'Added to cart')}
function openShisha(i){shishaItem=i;selectedType=DATA.shishaOptions.types.find(x=>x.id===i.shishaType)||DATA.shishaOptions.types[0];selectedFlavor=null;renderShisha();$('shishaOverlay').classList.add('open')}
function renderShisha(){$('typeRow').innerHTML=DATA.shishaOptions.types.map(x=>`<button class="type ${selectedType?.id===x.id?'selected':''}" onclick="selectType('${x.id}')"><b>${txt(x)}</b><small>${money(x.price)} — ${lang==='ar'?x.descAr:x.descEn}</small></button>`).join('');const allowed=shishaItem.flavors||DATA.shishaOptions.flavors.map(x=>x.id);$('flavorGrid').innerHTML=DATA.shishaOptions.flavors.filter(x=>allowed.includes(x.id)).map(x=>`<button class="flavor ${selectedFlavor===x.id?'selected':''}" onclick="selectFlavor('${x.id}')">${txt(x)}</button>`).join('')}
function selectType(id){selectedType=DATA.shishaOptions.types.find(x=>x.id===id);renderShisha()}function selectFlavor(id){selectedFlavor=id;renderShisha()}
$('addShisha').onclick=()=>{if(!selectedType||!selectedFlavor){toast(lang==='ar'?'اختر النوع والنكهة أولاً':'Choose type and flavor first');return}const fl=DATA.shishaOptions.flavors.find(x=>x.id===selectedFlavor),key=`shisha|${selectedType.id}|${fl.id}`;let q=cartItems.find(x=>x.key===key);if(q)q.qty++;else cartItems.push({key,id:shishaItem.id,qty:1,price:selectedType.price,name:selectedType.ar,nameEn:selectedType.en,flavor:fl.ar,flavorEn:fl.en});$('shishaOverlay').classList.remove('open');updateCart();toast(lang==='ar'?'تمت إضافة الأرجيلة':'Shisha added')}
function updateCart(){const n=cartItems.reduce((s,x)=>s+x.qty,0),total=cartItems.reduce((s,x)=>s+x.price*x.qty,0);$('cart').classList.toggle('show',n>0);$('cartText').textContent=lang==='ar'?`السلة • ${n} صنف`:`Cart • ${n} items`;$('cartTotal').textContent=money(total);renderCart()}
function renderCart(){if(!cartItems.length){$('cartItems').innerHTML='<div class="notice">السلة فارغة.</div>';$('total').textContent=money(0);return}let total=0;$('cartItems').innerHTML=cartItems.map((x,i)=>{total+=x.price*x.qty;const name=lang==='ar'?x.name:x.nameEn;return `<div class="row"><div><b>${name}</b>${x.flavor?`<small>${lang==='ar'?'النكهة: '+x.flavor:'Flavor: '+x.flavorEn}</small>`:''}<small>${money(x.price)} × ${x.qty}</small></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`}).join('');$('total').textContent=money(total)}
function changeQty(i,d){cartItems[i].qty+=d;if(cartItems[i].qty<=0)cartItems.splice(i,1);updateCart()}
function selectMode(mode){orderMode=mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));$('hallFields').style.display=mode==='hall'?'block':'none';$('deliveryFields').style.display=mode==='delivery'?'block':'none'}
function validateOrder(){if(!cartItems.length){toast(lang==='ar'?'السلة فارغة':'Cart is empty');return null}if(orderMode==='hall'){const table=$('table').value.trim();if(!table){toast(lang==='ar'?'اكتب رقم الطاولة أولاً':'Enter the table number first');return null}return {destination:lang==='ar'?`صالة — طاولة ${table}`:`Hall — Table ${table}`}}const phone=$('customerPhone').value.trim(),address=$('address').value.trim();if(!phone||!address){toast(lang==='ar'?'أدخل رقم الهاتف والعنوان أولاً':'Enter phone and address first');return null}return {destination:lang==='ar'?`توصيل — ${address} — ${phone}`:`Delivery — ${address} — ${phone}`}}
function orderText(){const v=validateOrder();if(!v)return null;const lines=cartItems.map(x=>`${x.qty} × ${lang==='ar'?x.name:x.nameEn}${x.flavor?` — ${lang==='ar'?x.flavor:x.flavorEn}`:''}`).join('\n');const total=cartItems.reduce((s,x)=>s+x.price*x.qty,0),notes=$('notes').value.trim();return `OLV — ${lang==='ar'?'طلب جديد':'New Order'}\n\n${lines}\n\n${lang==='ar'?'المجموع':'Total'}: ${money(total)}\n${lang==='ar'?'الطلب':'Order'}: ${v.destination}${notes?`\n${lang==='ar'?'ملاحظات':'Notes'}: ${notes}`:''}`}
$('whatsapp').onclick=()=>{const text=orderText();if(!text)return;const number=(DATA.settings.whatsappNumber||'962775826060').replace(/\D/g,'');window.open(`https://wa.me/${number}?text=${encodeURIComponent(text)}`,'_blank')};$('copy').onclick=async()=>{const text=orderText();if(!text)return;try{await navigator.clipboard.writeText(text);toast(lang==='ar'?'تم نسخ الطلب':'Order copied')}catch(e){toast(lang==='ar'?'تعذر النسخ':'Copy failed')}};
$('search').oninput=render;$('cart').onclick=()=>{$('orderOverlay').classList.add('open');renderCart()};$('closeOrder').onclick=()=>$('orderOverlay').classList.remove('open');$('cancelShisha').onclick=()=>$('shishaOverlay').classList.remove('open');$('orderOverlay').onclick=e=>{if(e.target===$('orderOverlay'))$('orderOverlay').classList.remove('open')};$('shishaOverlay').onclick=e=>{if(e.target===$('shishaOverlay'))$('shishaOverlay').classList.remove('open')};$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='ar'?'English':'العربية';$('search').placeholder=lang==='ar'?'ابحث عن صنف أو نكهة...':'Search item or flavor...';$('orderTitle').textContent=lang==='ar'?'طلبك':'Your Order';$('totalLabel').textContent=lang==='ar'?'المجموع':'Total';$('modeTitle').textContent=lang==='ar'?'اختر طريقة الطلب':'Choose order type';$('hallLabel').textContent=lang==='ar'?'صالة':'Hall';$('deliveryLabel').textContent=lang==='ar'?'توصيل':'Delivery';$('hallHint').textContent=lang==='ar'?'الطلب داخل الكافيه':'Order inside the cafe';$('deliveryHint').textContent=lang==='ar'?'الطلب إلى موقعك':'Order to your location';$('whatsapp').textContent=lang==='ar'?'إرسال الطلب عبر واتساب':'Send order via WhatsApp';$('copy').textContent=lang==='ar'?'نسخ الطلب':'Copy order';$('closeOrder').textContent=lang==='ar'?'متابعة التصفح':'Continue browsing';renderCats();render();renderShisha()};
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>$('toast').classList.remove('show'),1600)}init();
</script></body></html>
