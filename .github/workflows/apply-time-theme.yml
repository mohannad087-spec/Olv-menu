name: Apply OLV time theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add automatic time theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          /* OLV automatic day/night theme: 06:00–17:59 light, 18:00–05:59 dark */
          body.olv-light{background:radial-gradient(circle at 50% -10%,#fffdf7 0,#f5eee1 42%,#ebe1cf 100%);color:#2b241b}
          body.olv-light .entry{background:#f4ecde;color:#2b241b}
          body.olv-light .entry-bg{background:linear-gradient(115deg,rgba(255,251,243,.78),rgba(224,191,133,.26),rgba(255,250,240,.82)),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=90') center/cover;filter:saturate(1.12) contrast(1.02)}
          body.olv-light .entry-title,body.olv-light .choice h1,body.olv-light .category-title,body.olv-light .section-head h2{color:#9a6b20}
          body.olv-light .entry-copy{color:#665844}
          body.olv-light .entry-btn{color:#fff9ed}
          body.olv-light .choice{background:radial-gradient(circle at 50% 20%,#fffaf0,#eee3d0 72%);color:#2b241b}
          body.olv-light .choice-kicker,body.olv-light .choice-phone{color:#9a6b20}
          body.olv-light .choice p{color:#665b4d}
          body.olv-light .choice-box{background:linear-gradient(145deg,#fffdf8,#eee4d4);border-color:#c9aa73;color:#2b241b;box-shadow:0 18px 45px rgba(84,61,28,.16)}
          body.olv-light .choice-box strong,body.olv-light .choice-icon{color:#9a6b20}
          body.olv-light .choice-box span{color:#756a5b}
          body.olv-light .hero-card{border-color:#c8a96e;box-shadow:0 25px 70px rgba(77,57,29,.18)}
          body.olv-light .hero-card{background-image:linear-gradient(110deg,rgba(255,248,235,.90),rgba(255,247,229,.30)),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=90')}
          body.olv-light .hero-card.delivery{background-image:linear-gradient(110deg,rgba(255,248,235,.92),rgba(255,247,229,.34)),url('https://images.unsplash.com/photo-1529429617124-95b109e86bb8?auto=format&fit=crop&w=1800&q=90')}
          body.olv-light .hero-shine{background:radial-gradient(circle at 72% 32%,rgba(214,164,67,.18),transparent 27%),linear-gradient(90deg,rgba(255,250,240,.72),transparent 73%)}
          body.olv-light .hero-copy{color:#5f5344}
          body.olv-light .pill,body.olv-light .mode-chip{background:rgba(255,250,240,.88);border-color:#c8a96e;color:#8d641e}
          body.olv-light .toolbar{background:linear-gradient(#f5eee3 76%,transparent)}
          body.olv-light .search{background:#fffdf9;border-color:#d7c9b3;color:#2b241b}
          body.olv-light .lang{background:#f2e8d7;border-color:#c8a96e;color:#8d641e}
          body.olv-light .cat{background:#fffdf9;border-color:#d8cbb7;color:#655b50}
          body.olv-light .quick button{background:#f7efe3;border-color:#d1b987;color:#80601f}
          body.olv-light .item{background:linear-gradient(160deg,#fffdf9,#f1e7d8);border-color:#ddcfba;box-shadow:0 14px 35px rgba(76,57,30,.12)}
          body.olv-light .item:hover{border-color:#b18a4a}
          body.olv-light .media{background:#eee3d3}
          body.olv-light .media:after{background:linear-gradient(180deg,transparent 48%,rgba(32,24,15,.72) 100%)}
          body.olv-light .favorite{background:rgba(255,250,240,.78);border-color:#b89557;color:#4b3c29}
          body.olv-light .badge{background:#e7c26d;color:#3b270c}
          body.olv-light .body h3,body.olv-light .item h3{color:#2b241b}
          body.olv-light .en{color:#85786a}
          body.olv-light .desc{color:#706559}
          body.olv-light .price{color:#986b20}
          body.olv-light .add{background:linear-gradient(135deg,#f0dfbc,#e1bd69);border-color:#b58a42;color:#674713}
          body.olv-light .featured .feature{border-color:#d1b47b;background:#eee4d5}
          body.olv-light .benefit{background:linear-gradient(160deg,#fffdf8,#eee5d7);border-color:#ddd0bb}
          body.olv-light .benefit span{color:#756a5d}
          body.olv-light .category-overlay{background:rgba(250,245,236,.94)}
          body.olv-light .category-top{background:linear-gradient(#f7f0e5 76%,transparent)}
          body.olv-light .category-back{background:#fffaf1;border-color:#c7aa72;color:#8d641e}
          body.olv-light .subcategory-card{background:#eee4d5;border-color:#d2b983}
          body.olv-light .subitem{background:linear-gradient(160deg,#fffdf9,#f1e7d9);border-color:#ddd0bb}
          body.olv-light .subitem p{color:#706559}
          body.olv-light .overlay{background:rgba(60,47,30,.34)}
          body.olv-light .sheet{background:linear-gradient(#fffaf1,#f0e6d8);border-color:#c8a96e;color:#2b241b}
          body.olv-light .detail-copy h3,body.olv-light .sheet h2{color:#2b241b}
          body.olv-light .detail-copy p{color:#706559}
          body.olv-light .order-box{border-color:#d8cbb7}
          body.olv-light .mode,body.olv-light .field,body.olv-light .type,body.olv-light .flavor{background:#fffdf9;border-color:#d8cbb7;color:#3d3429}
          body.olv-light .mode.selected,body.olv-light .type.selected,body.olv-light .flavor.selected{background:#f4e5c5;border-color:#b58a42;color:#7e5a1e}
          body.olv-light .field{color:#2b241b}
          body.olv-light .notice{background:#f7eddb;border-color:#d5bd8b;color:#715a35}
          body.olv-light .secondary{background:#fffdf9;border-color:#d8cbb7;color:#4d4337}
          body.olv-light .closex{background:#fffaf1;border-color:#c9b89d;color:#3f3427}
          body.olv-light .cart{box-shadow:0 18px 50px rgba(77,57,29,.22)}
          body.olv-light .toast{background:#30281e;color:#fffaf1}
          @media(prefers-reduced-motion:reduce){body.olv-light *{scroll-behavior:auto}}
          '''

          js = r'''
          <script>
          (function(){
            const h=new Date().getHours();
            const light=h>=6&&h<18;
            document.body.classList.toggle('olv-light',light);
            document.documentElement.dataset.olvTheme=light?'light':'dark';
            const meta=document.querySelector('meta[name="theme-color"]');
            if(meta)meta.content=light?'#f5eee3':'#060606';
            window.olvApplyTimeTheme=function(){
              const now=new Date().getHours(),isLight=now>=6&&now<18;
              document.body.classList.toggle('olv-light',isLight);
              document.documentElement.dataset.olvTheme=isLight?'light':'dark';
              if(meta)meta.content=isLight?'#f5eee3':'#060606';
            };
          })();
          </script>
          '''

          if '/* OLV automatic day/night theme:' not in s:
              s=s.replace('</style>', css + '\n</style>', 1)
          if 'window.olvApplyTimeTheme' not in s:
              s=s.replace('<body>', '<body>\n' + js, 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-time-theme.yml
          git rm .github/workflows/apply-time-theme.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add automatic OLV light and dark theme"
          git push
