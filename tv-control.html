<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>OLV | التحكم بالشاشات</title>
<link rel="icon" href="assets/olv-icon.png">
<link rel="stylesheet" href="assets/olv-theme.css?v=b6">
<style>
body{margin:0;padding:16px 16px 90px;max-width:760px;margin-inline:auto}
h1{font:700 26px var(--display);margin:8px 0 4px}
.sub{color:var(--ink2);margin:0 0 18px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font:600 18px var(--font);margin:0 0 2px}
.card .id{color:var(--ink2);font-size:12px;direction:ltr;text-align:right;margin-bottom:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:8px 0}
.seg button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:15px;color:var(--ink)}
.seg button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.lbl{font-size:13px;color:var(--ink2);margin-top:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.th{position:relative;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk);aspect-ratio:16/10;padding:0;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.th .nm{position:absolute;inset-inline:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .x{position:absolute;top:4px;inset-inline-start:4px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:16px;line-height:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:15px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.bar{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
.bar .msg{flex:1;font-size:14px;color:var(--ink2)}
.err{color:#d66}.ok{color:#4a9a62}
input[type=password]{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font-size:16px;flex:1;min-width:0}
.empty{color:var(--ink2);font-size:14px;padding:8px 0}
</style>
</head>
<body>
<h1>التحكم بالشاشات</h1>
<p class="sub">اختر لكل شاشة تعرض المنيو أو بنر ثابت. التغيير بيوصل للشاشة خلال ثواني بدون ما تلمس الريموت.</p>

<div id="authbox" class="card" hidden>
  <div class="lbl" style="margin-top:0">أدخل باسورد الإدارة</div>
  <div class="row"><input id="key" type="password" autocomplete="current-password" placeholder="باسورد الإدارة"><button class="btn pri" id="keyBtn">دخول</button></div>
</div>

<div id="screens"></div>

<div class="card">
  <h2>مكتبة البنرات</h2>
  <div class="id" style="direction:rtl">ارفع صورة من تلفونك أو الكمبيوتر، وبعدها اخترها لأي شاشة. الأفضل بمقاس 16:9.</div>
  <div class="row"><label class="btn pri" for="file" style="cursor:pointer">رفع صورة جديدة</label><input id="file" type="file" accept="image/*" hidden><span id="upmsg" class="lbl"></span></div>
  <div id="lib" class="thumbs"></div>
</div>

<div class="bar"><div class="msg" id="status"></div><button class="btn pri" id="save">حفظ وتطبيق على الشاشات</button></div>

<script>
var SCREENS=[
  {id:'screen',name:'الشاشة الأولى',note:'screen.olvcafe.com'},
  {id:'screen2',name:'الشاشة الثانية',note:'screen2.olvcafe.com'},
  {id:'screen3',name:'Skyworth (التحت)',note:'screen3.olvcafe.com'}
];
var DEFAULT_SHOW={screen:'food',screen2:'drinks',screen3:'all'};
var state={screens:{},banners:[],saved:{}};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function headers(){
  var h={'content-type':'application/json'};
  var k='';try{k=(localStorage.getItem('olv-admin-key')||'').replace(/[^\x21-\x7e]/g,'')}catch(e){}
  if(k)h['x-olv-admin-key']=k;
  return h;
}
function api(method,body,q){
  return fetch('/api/tv-config'+(q||''),{method:method,headers:headers(),body:body?JSON.stringify(body):undefined,credentials:'same-origin'}).then(function(r){
    return r.json().catch(function(){return{}}).then(function(o){if(!r.ok||o.ok===false){var e=new Error(o.error||'تعذّر الاتصال');e.status=r.status;throw e}return o});
  });
}
function say(t,cls){var s=$('status');s.textContent=t||'';s.className='msg '+(cls||'')}

function ensureCfg(id){
  if(!state.screens[id])state.screens[id]={mode:'menu',show:DEFAULT_SHOW[id]||'all'};
  return state.screens[id];
}

function render(){
  $('screens').innerHTML=SCREENS.map(function(s){
    var c=ensureCfg(s.id);
    var seg=function(group,val,opts){return '<div class="seg">'+opts.map(function(o){return '<button data-s="'+s.id+'" data-g="'+group+'" data-v="'+o[0]+'" class="'+(val===o[0]?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div>'};
    var body=seg('mode',c.mode,[['menu','المنيو'],['banner','بنر ثابت']]);
    if(c.mode==='menu')body+='<div class="lbl">شو يعرض المنيو؟</div>'+seg('show',c.show,[['food','أكل وحلويات'],['drinks','مشروبات'],['all','الكل']]);
    else body+='<div class="lbl">اختر البنر</div>'+(state.banners.length?'<div class="thumbs">'+state.banners.map(function(b){return '<button class="th'+(c.banner===b.id?' on':'')+'" data-s="'+s.id+'" data-b="'+b.id+'"><img src="'+esc(b.url)+'" alt=""><span class="nm">'+esc(b.name)+'</span></button>'}).join('')+'</div>':'<div class="empty">ما في بنرات. ارفع صورة من الأسفل.</div>');
    body+='<div class="row"><a class="btn" target="_blank" rel="noopener" href="/tv.html?id='+s.id+'">معاينة</a></div>';
    return '<div class="card"><h2>'+esc(s.name)+'</h2><div class="id">'+esc(s.note)+'</div>'+body+'</div>';
  }).join('');
  $('lib').innerHTML=state.banners.length?state.banners.map(function(b){return '<div class="th"><img src="'+esc(b.url)+'" alt=""><span class="nm">'+esc(b.name)+'</span><button class="x" data-del="'+b.id+'" aria-label="حذف">×</button></div>'}).join(''):'<div class="empty">ما في صور بعد.</div>';
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.del){
    if(!confirm('حذف هالصورة؟ أي شاشة عارضتها بترجع للمنيو.'))return;
    say('جاري الحذف…');
    api('POST',{deleteBanner:b.dataset.del}).then(load).then(function(){say('انحذفت','ok')}).catch(fail);return;
  }
  if(b.dataset.b){ensureCfg(b.dataset.s).banner=b.dataset.b;render();return}
  if(b.dataset.g){var c=ensureCfg(b.dataset.s);c[b.dataset.g]=b.dataset.v;if(c.mode==='menu')delete c.banner;render()}
});

$('save').onclick=function(){
  var out={};
  SCREENS.forEach(function(s){var c=ensureCfg(s.id);out[s.id]=c.mode==='banner'?{mode:'banner',show:c.show,banner:c.banner}:{mode:'menu',show:c.show}});
  say('جاري الحفظ…');
  api('POST',{screens:out}).then(function(o){state.screens=o.screens||state.screens;render();say('انحفظ. الشاشات بتتحدّث خلال ثواني','ok')}).catch(fail);
};

// رفع صورة: بنصغّرها بالمتصفح (عرض أقصى 1920) وبنحفظها JPEG حتى تضل خفيفة
$('file').onchange=function(){
  var f=this.files[0];this.value='';if(!f)return;
  $('upmsg').textContent='جاري تجهيز الصورة…';
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var sc=Math.min(1,1920/img.width),c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var q=.88,d=c.toDataURL('image/jpeg',q);
    while(d.length>1700000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
    var name=(f.name||'بنر').replace(/\.[^.]+$/,'').slice(0,40);
    $('upmsg').textContent='جاري الرفع…';
    api('POST',{addBanner:{name:name,dataUrl:d}}).then(load).then(function(){$('upmsg').textContent='انرفعت. اخترها لأي شاشة.'}).catch(function(er){$('upmsg').textContent='';fail(er)});
  };
  img.onerror=function(){$('upmsg').textContent='';say('ما قدرت أقرأ الصورة','err')};
  img.src=url;
};

function fail(e){
  if(e.status===403){$('authbox').hidden=false;say('أدخل باسورد الإدارة أولًا','err')}else say(e.message,'err');
}
$('keyBtn').onclick=function(){
  var v=$('key').value.replace(/[^\x21-\x7e]/g,'');
  try{localStorage.setItem('olv-admin-key',v)}catch(e){}
  $('authbox').hidden=true;load();
};

function load(){
  return api('GET',null,'?full=1&ts='+Date.now()).then(function(o){
    $('authbox').hidden=true;
    state.banners=o.banners||[];
    SCREENS.forEach(function(s){if(o.screens&&o.screens[s.id]){state.screens[s.id]=o.screens[s.id];state.saved[s.id]=1}});
    render();say('');
  }).catch(function(e){render();fail(e)});
}
load();
</script>
</body>
</html>
