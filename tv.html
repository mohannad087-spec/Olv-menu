<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLV | منيو الشاشة</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/olv-icon.png">
<link rel="stylesheet" href="assets/olv-theme.css?v=b6">
<style>
/* شاشة التلفاز: مرحلة ثابتة 1920x1080 بتتكبّر/بتصغر لتناسب أي شاشة 16:9 */
html,body{margin:0;height:100%;overflow:hidden;cursor:none;background:var(--ground)}
body{font-size:16px}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;isolation:isolate}
#stage:before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(55% 45% at 92% 6%,var(--amb1),transparent 72%),radial-gradient(50% 55% at 0% 50%,var(--amb2),transparent 72%),
    radial-gradient(55% 40% at 78% 100%,var(--amb3),transparent 72%),radial-gradient(40% 35% at 100% 62%,var(--amb4),transparent 72%),var(--ground)}
:root{--amb1:rgba(226,150,96,.55);--amb2:rgba(140,178,120,.38);--amb3:rgba(222,176,80,.42);--amb4:rgba(217,140,151,.26);
  --glass:rgba(255,255,255,.085);--glass-line:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.22);--shadow:0 18px 50px rgba(0,0,0,.32)}
:root[data-olv-theme="light"]{--amb1:rgba(232,160,112,.5);--amb2:rgba(150,186,130,.46);--amb3:rgba(226,184,96,.42);--amb4:rgba(217,140,151,.3);
  --glass:rgba(255,255,255,.5);--glass-line:rgba(255,255,255,.8);--glass-hi:rgba(255,255,255,.95);--shadow:0 18px 50px rgba(90,70,40,.14)}

.slide{position:absolute;inset:0;display:flex;gap:56px;padding:64px 72px 72px;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.slide.on{opacity:1;visibility:visible;transition:opacity .45s ease}

.side{flex:0 0 520px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:8px 0}
.logo{width:440px;height:auto;display:block}
.cat-ar{font:700 132px/1.15 var(--display);margin:0;color:var(--ink);letter-spacing:0}
.cat-en{font:500 44px/1.2 var(--font);color:var(--ink2);margin:14px 0 0;direction:ltr;text-align:right;align-self:flex-start;letter-spacing:.04em;text-transform:uppercase}
.rule{width:96px;height:6px;border-radius:3px;background:var(--fc,var(--ink));margin:34px 0 0}
.dots{display:flex;gap:12px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ink2);opacity:.35}
.dots i.cur{opacity:1;background:var(--ink);width:44px;border-radius:7px}

.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:32px;min-width:0}
.grid.n1,.grid.n2,.grid.n3,.grid.n4{grid-template-rows:1fr}
.grid.n1{grid-template-columns:minmax(0,760px)}.grid.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.n3{grid-template-columns:repeat(3,1fr)}
.grid.n5,.grid.n6{grid-template-columns:repeat(3,1fr)}
.card{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--glass-line);border-radius:36px;overflow:hidden;
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow);opacity:0;transform:translateY(24px)}
.slide.on .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 80ms)}
@keyframes rise{to{opacity:1;transform:none}}
.photo{flex:1;min-height:0;background:var(--sunk) center/cover no-repeat}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:22px 28px 26px;display:flex;flex-direction:column;gap:10px}
.name{font:600 38px/1.25 var(--font);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.n5 .name,.n6 .name,.n1 .name,.n2 .name,.n3 .name{font-size:44px}
.price{font:700 46px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price small{font:500 26px var(--font);color:var(--ink2)}
.price .alt{font:500 28px var(--font);color:var(--ink2)}

/* عرض اليوم */
.offer{flex:1;display:flex;align-items:center;gap:72px}
.offer .photo{flex:0 0 760px;height:100%;border-radius:48px;overflow:hidden;box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
.offer .txt{flex:1;display:flex;flex-direction:column;gap:18px;align-items:flex-start;justify-content:center}
.offer .was{font:500 40px var(--font);color:var(--ink2)}
.offer .photo{display:grid;gap:16px;background:none;box-shadow:none;min-height:0;overflow:visible}
.offer .photo img{width:100%;height:100%;min-height:0;object-fit:cover}
.offer .txt .logo{width:300px}
.offer .photo img{border-radius:40px;box-shadow:var(--shadow)}
.offer .photo.n3{grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr}.offer .photo.n3 img:first-child{grid-column:1/3}
.offer .photo.n1 img{border-radius:48px}
.offer .tag{font:600 40px var(--font);padding:10px 34px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.offer h2{font:700 104px/1.15 var(--display);margin:0}
.offer p{font:500 44px/1.4 var(--font);color:var(--ink2);margin:0}
.offer .big{font:700 160px/1 var(--display);display:flex;align-items:baseline;gap:20px;font-variant-numeric:tabular-nums}
.offer .big small{font:600 56px var(--font);color:var(--ink2)}
#fs{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font:500 30px var(--font);color:var(--ink2);background:var(--glass);border:1px solid var(--glass-line);padding:12px 32px;border-radius:999px;transition:opacity .6s;pointer-events:none}
#bar{position:absolute;bottom:0;right:0;height:6px;background:var(--ink);opacity:.55;width:0}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:600 56px var(--font);color:var(--ink2)}
.lowmo .slide,.lowmo .slide.on{transition:none}
@media(prefers-reduced-motion:reduce){.slide.on .card{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage"><div id="msg">جاري تحميل المنيو…</div><div id="bar"></div><div id="fs">اضغط أي مكان لملء الشاشة</div></div>
<script>
(function(){
var DWELL=7000,REFRESH=120000,PER=3;
var stage=document.getElementById('stage'),bar=document.getElementById('bar'),msg=document.getElementById('msg');
var FC=['--f0','--f1','--f2','--f3','--f4','--f5'];

function theme(){var h=new Date().getHours(),l=h>=6&&h<18;document.documentElement.dataset.olvTheme=l?'light':'dark'}
theme();setInterval(theme,60000);

function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return Number(n).toFixed(2)}
// نعرض سعر الصالة بدون ذكر كلمة صالة (الدونات سفري بس فبتضل بسعرها)
function shown(i){return i.cat!=='donuts'&&i.hallPrice>0?Number(i.hallPrice):Number(i.price)}
function shownLarge(i){return i.cat!=='donuts'&&i.large.hallPrice>0?Number(i.large.hallPrice):Number(i.large.price)}
function priceHtml(i){
  var p='';
  if(Array.isArray(i.variants)&&i.variants.length){
    var ps=i.variants.filter(function(v){return v.available!==false}).map(function(v){return Number(v.price)});
    if(ps.length){var lo=Math.min.apply(null,ps),hi=Math.max.apply(null,ps);p=lo===hi?money(lo):'<small>من</small> '+money(lo)}
  }
  if(!p)p=money(shown(i));
  var alt=(i.large&&i.large.price)?'<span class="alt">كبير '+money(shownLarge(i))+'</span>':'';
  return p+' <small>JD</small>'+alt;
}

// عرض اليوم: بيظهر بس بالتاريخ المحدد (بتوقيت عمّان) وبعدها بيختفي لحاله
// شاشتين: المشروبات لحالها، والباقي (أكل وحلويات وأرجيلة) لحاله. بتتحدد من الدومين أو من ?show=drinks|food
var DRINKS=['hot','cold','cocktails','juices','shakes'];
var MODE=(new URLSearchParams(location.search).get('show')||(/^screen2\./.test(location.hostname)?'drinks':/^screen\./.test(location.hostname)?'food':'all')).toLowerCase();
function inMode(id){return MODE==='drinks'?DRINKS.indexOf(id)>-1:MODE==='food'?DRINKS.indexOf(id)<0:true}
// المتصفح بيمنع ملء الشاشة التلقائي، فأول ضغطة أو مفتاح بتدخّل ملء الشاشة
(function(){var h=document.getElementById('fs');
function go(){var e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}
function done(){h.style.opacity=0;['click','keydown','touchend'].forEach(function(t){removeEventListener(t,on)})}
function on(){go();done()}
['click','keydown','touchend'].forEach(function(t){addEventListener(t,on)});
document.addEventListener('fullscreenchange',function(){if(document.fullscreenElement)h.style.opacity=0});
setTimeout(function(){h.style.opacity=0},12000);})();
var OFFERS=[
 {date:'2026-10-21',tag:'عرض اليوم فقط',title:'وجبة برغر OLV',desc:'برغر لحم، جبنة، خس، طماطم وصوص OLV',price:5,unit:'دنانير',images:['assets/photos/olv-burger.webp'],modes:['all','food'],every:5},
 {off:true,date:null,tag:'لحد نفاذ الكمية',title:'دونات طازجة',desc:'لوتس، أوريو أو شوكولاتة',price:'0.50',unit:'دينار للحبة',was:'0.75',images:['assets/photos/donut-chocolate.webp','assets/photos/donut-lotus.webp','assets/photos/donut-oreo.webp'],modes:['all','food','drinks'],every:5}
];
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Amman'}).format(new Date())}
function activeOffers(){var t=today();return OFFERS.filter(function(o){return!o.off&&(!o.date||o.date===t)&&o.modes.indexOf(MODE)>-1})}
var slides=[],cur=-1,timer=null,t0=performance.now(),sig='';

function build(DATA){
  var out=[];
  DATA.categories.forEach(function(c,ci){
    if(!inMode(c.id)||(MODE==='drinks'&&c.id==='popular'))return;
    var items=c.id==='popular'?DATA.items.filter(function(i){return i.popular&&i.available!==false&&!i.inGroup}):
      DATA.items.filter(function(i){return i.cat===c.id&&i.available!==false&&!i.inGroup});
    if(!items.length)return;
    var pages=Math.ceil(items.length/PER);
    var per=Math.ceil(items.length/pages);
    for(var p=0;p<pages;p++)out.push({cat:c,ci:ci,items:items.slice(p*per,(p+1)*per),page:p,pages:pages});
  });
  var offs=activeOffers();
  if(offs.length){var res=[],k=0,j=0;offs.forEach(function(o){res.push({offer:o})});out.forEach(function(x){res.push(x);if(++k%5===0)res.push({offer:offs[j++%offs.length]})});return res}
  return out;
}

function slideEl(s){
  var el=document.createElement('section');el.className='slide';
  if(s.offer){
    var o=s.offer,ph=o.images.map(function(u){return '<img src="'+esc(u)+'" alt="">'}).join('');
    el.innerHTML='<div class="offer"><div class="photo n'+o.images.length+'">'+ph+'</div><div class="txt"><img class="logo" src="assets/olv-logo-transparent.webp" alt="OLV"><span class="tag">'+esc(o.tag)+'</span><h2>'+esc(o.title)+'</h2><p>'+esc(o.desc)+'</p><div class="big">'+esc(String(o.price).replace(/\.00$/,''))+' <small>'+esc(o.unit)+'</small></div>'+(o.was?'<span class="was">بدل '+esc(o.was)+' دينار</span>':'')+'</div></div>';
    return el;
  }
  var dots='';if(s.pages>1){for(var d=0;d<s.pages;d++)dots+='<i'+(d===s.page?' class="cur"':'')+'></i>'}
  var cards=s.items.map(function(i,k){
    var img=i.image?'<img src="'+esc(i.image)+'" alt="" decoding="async">':'';
    return '<article class="card" style="--i:'+k+'"><div class="photo">'+img+'</div><div class="info"><h3 class="name">'+esc(i.ar)+'</h3><div class="price">'+priceHtml(i)+'</div></div></article>';
  }).join('');
  el.innerHTML='<aside class="side" style="--fc:var('+FC[s.ci%FC.length]+')"><img class="logo" src="assets/olv-logo-transparent.webp" alt="OLV">'+
    '<div><h1 class="cat-ar">'+esc(s.cat.ar)+'</h1><p class="cat-en">'+esc(s.cat.en)+'</p><div class="rule"></div></div>'+
    '<div class="dots">'+dots+'</div></aside><div class="grid n'+s.items.length+'">'+cards+'</div>';
  return el;
}

function show(n){
  var old=stage.querySelector('.slide.on');if(old)old.classList.remove('on');
  var prev=stage.querySelectorAll('.slide');
  var el=slideEl(slides[n]);stage.insertBefore(el,bar);
  void el.offsetWidth;el.classList.add('on');
  setTimeout(function(){prev.forEach(function(p){if(p!==el&&!p.classList.contains('on'))p.remove()})},700);
  cur=n;t0=performance.now();
  // حمّل الصورة اللي بعدها مسبقاً
  var nx=slides[(n+1)%slides.length];(nx.items||[]).forEach(function(i){if(i.image){var im=new Image();im.src=i.image}});
}
function tick(now){
  var f=Math.min(1,(now-t0)/DWELL);bar.style.width=(f*100)+'%';
  if(f>=1&&slides.length)show((cur+1)%slides.length);
  requestAnimationFrame(tick);
}

function load(first){
  return fetch('data/menu.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(D){
    var s=build(D);
    var ns=MODE+JSON.stringify(s.map(function(x){if(x.offer)return 'offer:'+x.offer.title;return[x.cat.id,x.cat.ar,x.items.map(function(i){return[i.id,i.ar,i.price,i.hallPrice,i.image,i.large,i.variants]})]}));
    if(ns===sig)return;           // ما تغيّر شي
    sig=ns;slides=s;
    msg.style.display='none';
    if(first||cur<0||cur>=slides.length){show(0)}else{show(cur)}
  }).catch(function(){if(first){msg.textContent='تعذّر تحميل المنيو';msg.style.display='flex'}});
}
requestAnimationFrame(tick);
load(true);
// لو فشل أول تحميل (نت ضعيف أو رفرش) بنعيد المحاولة كل 10 ثواني لين ينجح
var retry=setInterval(function(){if(slides.length)clearInterval(retry);else load(true)},10000);
setInterval(function(){load(false)},REFRESH);
// تحديث تلقائي: كل دقيقة بنفحص إذا الصفحة نفسها اتغيرت على السيرفر، ولو اتغيرت بنعيد التحميل لحالنا (ما بتحتاج ريموت)
var ver=null;
function checkVer(){fetch('tv.html?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){var h=t.length+':'+t.slice(-200);if(ver===null)ver=h;else if(h!==ver)location.reload()}).catch(function(){})}
checkVer();setInterval(checkVer,60000);
// وكمان إعادة تحميل كاملة كل 6 ساعات احتياطًا
setTimeout(function(){location.reload()},6*3600*1000);
})();
</script>
</body>
</html>
