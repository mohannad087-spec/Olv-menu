<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d1b18">
<title>OLV — طلب الموظفين</title>

<link rel="preload" href="assets/fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/olv-theme.css?v=a2"><script>(function(){try{var h=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Amman",hour:"2-digit",hourCycle:"h23"}).format(new Date())),l=h>=6&&h<18;document.documentElement.dataset.olvTheme=l?"light":"dark";document.addEventListener("DOMContentLoaded",function(){document.body.classList.toggle("olv-light",l)});var m=document.querySelector("meta[name=theme-color]");if(m)m.content=l?"#efede9":"#1d1b18"}catch(e){}})()</script>
<style>*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.wrap{max-width:1000px;margin:auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{margin:0;font:500 24px/1.3 var(--display);color:var(--ink)}
.who{font-size:13px;color:var(--ink2)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 16px;font-weight:500;font-size:14px}
.login{max-width:420px;margin:60px auto;border:1px solid var(--line);border-radius:var(--r);padding:24px;background:var(--surface);text-align:center}
.login h2{margin:0 0 14px;font:500 24px var(--display);color:var(--ink)}
.login input{width:100%;min-height:48px;background:var(--ground);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:0 14px;margin-bottom:10px;font-size:16px}
.login button,.primary{width:100%;min-height:48px;margin-top:8px;border-radius:12px;border:0;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:15px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);text-align:center;font-size:14px;font-weight:500}
.tab.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;min-height:44px;background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:14px}
.cat.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.search{width:100%;min-height:48px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--ink);margin-bottom:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:100px;object-fit:cover;border-radius:10px;background:var(--sunk)}
.card.unavailable{opacity:.55}
.card h3{margin:0;font:500 15px/1.4 var(--font)}
.card .price{color:var(--ink2);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px}
.add{border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:20px;width:48px;height:44px}
.avail{min-height:44px;border:1px solid var(--line);background:var(--sunk);color:var(--ink2);border-radius:12px;padding:0 12px;font-size:13px}
.avail.off{border-color:var(--f0);color:var(--ink)}
.cartbar{position:fixed;z-index:300;left:16px;right:16px;bottom:16px;max-width:960px;margin:auto;display:none;align-items:center;justify-content:space-between;border:0;border-radius:var(--r);padding:16px 18px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:16px}
.cartbar.show{display:flex}
.overlay{position:fixed;inset:0;z-index:480;background:rgba(20,18,15,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--ground);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px}
.sheet h2{margin:0 0 10px;font:500 24px var(--display);color:var(--ink)}
.sheet .tot{display:flex;justify-content:space-between;padding:12px 0;font-size:18px;font-weight:600;color:var(--ink)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:18px}
.note{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;margin-top:8px;resize:vertical;font-size:16px}
.secondary{width:100%;min-height:48px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.myorders .oc{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;background:var(--surface)}
.oc .head{display:flex;justify-content:space-between;font-weight:600;color:var(--ink)}
.oc .tm{font-size:13px;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px;font-size:13px;margin-top:8px;background:var(--sunk);color:var(--ink)}
.badge:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink2)}
.b-new:before{background:var(--f1)}.b-confirmed:before{background:var(--f4)}.b-preparing:before{background:var(--f2)}.b-ready:before{background:var(--f3)}.b-cancelled:before{background:var(--f0)}
.empty{text-align:center;padding:40px;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;z-index:1000;left:50%;bottom:90px;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:12px;font-size:14px;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
#alertStack{position:fixed;top:10px;left:10px;right:10px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:640px;margin:auto}
.ready-alert{background:var(--surface);border:1px solid var(--f3);border-inline-start:6px solid var(--f3);color:var(--ink);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;animation:readyIn .4s ease both}
.ready-alert button{min-height:44px;border:0;background:var(--primary);color:var(--on-primary);border-radius:12px;padding:0 14px;font-weight:600;white-space:nowrap}
@keyframes readyIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ready-alert{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="olv-back" data-back="index.html"></button><h1>OLV — طلب الموظفين</h1></div><div id="whoBar" class="who" style="display:none"></div><div style="display:flex;gap:8px"><button class="btn" onclick="logout()" id="logoutBtn" style="display:none">تسجيل خروج</button><button class="btn" onclick="location.href='orders.html'">لوحة الطلبات</button></div></div>

<div id="login" class="login">
  <h2>تسجيل دخول الموظف</h2>
  <input id="waiterName" placeholder="اسمك">
  <input id="staffKey" type="password" placeholder="مفتاح الموظفين">
  <button onclick="doLogin()">دخول</button>
</div>

<div id="app" style="display:none">
  <div class="tabs"><button class="tab active" id="tabMenu" onclick="showTab('menu')">المنيو</button><button class="tab" id="tabMine" onclick="showTab('mine')">طلباتي</button></div>

  <div id="menuTab">
    <input id="search" class="search" placeholder="ابحث عن صنف...">
    <div id="cats" class="cats"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="mineTab" style="display:none" class="myorders"><div id="mineList"></div></div>
</div>
<div style="text-align:center;padding:16px 0 6px;font-size:12px;color:var(--ink2)">© 2026 OLV. جميع الحقوق محفوظة.</div>
</div>

<div id="alertStack"></div>
<button id="cartbar" class="cartbar" onclick="openCart()"><span id="cartText">السلة</span><span id="cartTotal"></span></button>
<div id="toast" class="toast"></div>

<div id="cartOverlay" class="overlay"><div class="sheet"><div style="margin:-4px 0 10px"><button class="olv-back" data-layer></button></div>
  <h2>الطلب الحالي</h2>
  <div id="cartRows"></div>
  <div class="tot"><span>المجموع</span><span id="cartTotal2"></span></div>
  <input id="tableNum" class="note" inputmode="numeric" placeholder="رقم الطاولة" style="margin-top:0">
  <input id="tablePhone" class="note" type="tel" placeholder="رقم هاتف الزبون (اختياري — لبرنامج الولاء)">
  <textarea id="orderNotes" class="note" rows="2" placeholder="ملاحظات على الطلب"></textarea>
  <button class="primary" onclick="submitOrder()">إرسال الطلب</button>
  <button class="secondary" onclick="closeCart()">إغلاق</button>
</div></div>

<script src="assets/back-nav.js"></script>
<script>
const $=id=>document.getElementById(id);
const money=n=>`${Number(n).toFixed(2)} JD`;
const imgs={burgers:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=70',snacks:'https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=400&q=70',sandwiches:'https://images.unsplash.com/photo-1553909489-cd47e0ef937f?auto=format&fit=crop&w=400&q=70',pasta:'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=400&q=70',salads:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400&q=70',hot:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=400&q=70',cold:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=400&q=70',juices:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=400&q=70',shakes:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=400&q=70',desserts:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=400&q=70',icecream:'https://images.unsplash.com/photo-1501443762994-82bd5dace89a?auto=format&fit=crop&w=400&q=70',donuts:'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=400&q=70',shisha:'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=400&q=70'};imgs.cocktails=imgs.juices;
const names={new:'جديد',confirmed:'تم التأكيد',preparing:'قيد التحضير',ready:'جاهز',completed:'مكتمل',cancelled:'ملغى'};
let DATA=null,cart=[],active='all',waiterName='',staffKey='',knownStatuses=null,audioCtx=null;

function showToast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>$('toast').classList.remove('show'),1700)}

function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(freq,delay,dur){setTimeout(()=>{try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur+.05)}catch(e){}},delay)}
function playReadyChime(){if(!audioCtx)return;beep(880,0,.45);beep(1046,250,.4)}
function notifyReady(orders){
  playReadyChime();
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  orders.forEach(o=>{
    const el=document.createElement('div');
    el.className='ready-alert';
    el.innerHTML=`<b>طلب #${o.number} جاهز${o.table?' — طاولة '+o.table:''}</b><button>تم الاستلام</button>`;
    el.querySelector('button').onclick=()=>el.remove();
    $('alertStack').appendChild(el);
  });
}

function doLogin(){
  const n=$('waiterName').value.trim(),k=$('staffKey').value.trim();
  if(!n||!k){showToast('عبّي الاسم والمفتاح');return}
  ensureAudio();
  waiterName=n;staffKey=k;
  localStorage.setItem('olv-waiter-name',n);
  sessionStorage.setItem('olv-staff-key',k);
  $('login').style.display='none';$('app').style.display='block';
  $('whoBar').style.display='block';$('whoBar').textContent='الموظف: '+n;
  $('logoutBtn').style.display='inline-block';
  init();
}
function logout(){sessionStorage.removeItem('olv-staff-key');location.reload()}

async function api(url,opt={}){
  opt.headers=Object.assign({'x-olv-staff-key':staffKey},opt.headers||{});
  const r=await fetch(url,opt),out=await r.json();
  if(!r.ok)throw Error(out.error||'Request failed');
  return out;
}

async function init(){
  try{DATA=await fetch('data/menu.json',{cache:'no-store'}).then(r=>r.json())}catch(e){$('grid').innerHTML='<div class="empty">تعذر تحميل المنيو.</div>';return}
  renderCats();renderGrid();loadMine();
  $('search').oninput=renderGrid;
  setInterval(loadMine,15000);
  document.addEventListener('click',ensureAudio);
}

function renderCats(){
  $('cats').innerHTML=['<button class="cat active" data-c="all">الكل</button>'].concat(DATA.categories.map(c=>`<button class="cat" data-c="${c.id}">${c.ar}</button>`)).join('');
  $('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>setCat(b.dataset.c));
}
// اختيار قسم = خطوة؛ زر الرجوع بيرجّع لـ«الكل»
function setCat(c,fromBack){
  const was=active;active=c;
  $('cats').querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.c===c));
  renderGrid();
  if(fromBack)return;
  if(was==='all'&&c!=='all')olvLayerOpen(()=>setCat('all',true));
  else if(was!=='all'&&c==='all')olvLayerBack();
}

function renderGrid(){
  const q=$('search').value.trim().toLowerCase();
  let items=DATA.items.filter(i=>!i.variants);
  if(active!=='all')items=items.filter(i=>i.cat===active);
  if(q)items=items.filter(i=>(i.ar+' '+i.en).toLowerCase().includes(q));
  $('grid').innerHTML=items.length?items.map(i=>{
    const ok=i.available!==false;
    return `<article class="card ${ok?'':'unavailable'}"><img src="${i.image||imgs[i.cat]||imgs.hot}" loading="lazy"><h3>${i.ar}</h3><div class="price">${i.large&&i.large.price?`صغير ${money(i.price)} · كبير ${money(i.large.price)}`:money(i.price)}</div><div class="row"><button class="avail ${ok?'':'off'}" onclick="toggleAvail('${i.id}',${ok})">${ok?'متوفر':'غير متوفر'}</button>${i.large&&i.large.price?`<button class="add" style="width:auto;padding:0 8px;font-size:12px" onclick="addToCart('${i.id}','small')" ${ok?'':'disabled'}>+ صغير</button><button class="add" style="width:auto;padding:0 8px;font-size:12px" onclick="addToCart('${i.id}','large')" ${ok?'':'disabled'}>+ كبير</button>`:`<button class="add" onclick="addToCart('${i.id}')" ${ok?'':'disabled'}>+</button>`}</div></article>`;
  }).join(''):'<div class="empty">لا توجد نتائج</div>';
}

async function toggleAvail(id,currentlyOk){
  try{
    await api('/api/menu-item',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id,available:!currentlyOk})});
    const item=DATA.items.find(x=>x.id===id);if(item)item.available=!currentlyOk;
    showToast(currentlyOk?'تم تعليمه كغير متوفر':'تم تعليمه كمتوفر');
    renderGrid();
  }catch(e){showToast(e.message)}
}

function addToCart(id,size){
  const i=DATA.items.find(x=>x.id===id);if(!i||i.available===false)return;
  // الأصناف اللي إلها حجمين بتنضاف كسطر منفصل لكل حجم
  const sized=!!(i.large&&i.large.price);if(sized&&size!=='large')size='small';
  const f=cart.find(x=>x.id===id&&(x.custom?.size||null)===(sized?size:null));
  if(f)f.qty++;else cart.push(sized?{id,qty:1,price:size==='large'?i.large.price:i.price,label:`${i.ar} (${size==='large'?'كبير':'صغير'})`,custom:{size}}:{id,qty:1,price:i.price,label:i.ar});
  updateCartBar();showToast('أُضيف للطلب');
}
function updateCartBar(){
  const n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.price*x.qty,0);
  $('cartbar').classList.toggle('show',n>0);
  $('cartText').textContent=`الطلب • ${n} صنف`;$('cartTotal').textContent=money(t);
}
function openCart(){
  $('cartRows').innerHTML=cart.map((x,idx)=>`<div class="crow"><span>${x.label}</span><div class="qty"><button onclick="cartQty(${idx},-1)">−</button><b>${x.qty}</b><button onclick="cartQty(${idx},1)">+</button></div><span>${money(x.price*x.qty)}</span></div>`).join('')||'<div class="empty">السلة فارغة</div>';
  $('cartTotal2').textContent=money(cart.reduce((a,x)=>a+x.price*x.qty,0));
  if(!$('cartOverlay').classList.contains('open')){$('cartOverlay').classList.add('open');olvLayerOpen(hideCart)}
}
function hideCart(){$('cartOverlay').classList.remove('open')}
function closeCart(){if($('cartOverlay').classList.contains('open')&&!olvLayerBack())hideCart()}
function cartQty(idx,d){cart[idx].qty+=d;if(cart[idx].qty<=0)cart.splice(idx,1);updateCartBar();openCart()}

async function submitOrder(){
  if(!cart.length){showToast('السلة فارغة');return}
  const table=$('tableNum').value.trim();
  if(!table){showToast('حط رقم الطاولة');return}
  const total=cart.reduce((a,x)=>a+x.price*x.qty,0);
  const text=cart.map(x=>`${x.label} × ${x.qty}`).join('\n')+`\nالمجموع: ${money(total)}`;
  const phone=$('tablePhone').value.trim();
  try{
    await api('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'hall',table,phone,waiter:waiterName,notes:$('orderNotes').value.trim(),items:cart,total,text})});
    cart=[];$('tableNum').value='';$('tablePhone').value='';$('orderNotes').value='';
    updateCartBar();closeCart();showToast('تم إرسال الطلب');
    loadMine();
  }catch(e){showToast(e.message)}
}

function showTab(t,fromBack){
  const was=$('mineTab').style.display==='none'?'menu':'mine';
  if(!fromBack&&was!==t){if(t==='mine')olvLayerOpen(()=>showTab('menu',true));else if(olvLayerBack())return}
  $('tabMenu').classList.toggle('active',t==='menu');
  $('tabMine').classList.toggle('active',t==='mine');
  $('menuTab').style.display=t==='menu'?'block':'none';
  $('mineTab').style.display=t==='mine'?'block':'none';
  if(t==='mine')loadMine();
}

async function loadMine(){
  try{
    const out=await api('/api/orders?ts='+Date.now());
    const mine=(out.orders||[]).filter(o=>o.waiter===waiterName);
    const nextKnown={},newlyReady=[];
    mine.forEach(o=>{
      nextKnown[o.id]=o.status;
      if(knownStatuses&&knownStatuses[o.id]&&knownStatuses[o.id]!=='ready'&&o.status==='ready')newlyReady.push(o);
    });
    knownStatuses=nextKnown;
    if(newlyReady.length)notifyReady(newlyReady);
    if($('mineTab').style.display==='none')return;
    $('mineList').innerHTML=mine.length?mine.map(o=>`<div class="oc"><div class="head"><span>#${o.number}</span><span>${o.table?'طاولة '+o.table:''}</span></div><div class="tm">${new Date(o.createdAt).toLocaleTimeString('ar-JO')}</div><span class="badge b-${o.status}">${names[o.status]||o.status}</span></div>`).join(''):'<div class="empty">ما في طلبات إلك بعد.</div>';
  }catch(e){if($('mineTab').style.display!=='none')$('mineList').innerHTML=`<div class="empty">${e.message}</div>`}
}

(function(){
  const n=localStorage.getItem('olv-waiter-name'),k=sessionStorage.getItem('olv-staff-key');
  if(n&&k){waiterName=n;staffKey=k;$('waiterName').value=n;$('staffKey').value=k;doLogin()}
})();
</script>
</body>
</html>
