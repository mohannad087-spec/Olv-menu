<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLV — طلب توصيل</title><meta name="robots" content="noindex,nofollow"><link rel="preload" href="assets/fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/olv-theme.css?v=b2"><link rel="stylesheet" href="assets/olv-staff.css?v=1"><script>(function(){try{var h=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Amman",hour:"2-digit",hourCycle:"h23"}).format(new Date())),l=h>=6&&h<18;document.documentElement.dataset.olvTheme=l?"light":"dark";document.addEventListener("DOMContentLoaded",function(){document.body.classList.toggle("olv-light",l)});var m=document.querySelector("meta[name=theme-color]");if(m)m.content=l?"#efede9":"#1d1b18"}catch(e){}})()</script><style>
.wrap{max-width:520px;margin:auto;padding:16px 14px 80px}
.logo{display:block;height:34px;margin:2px auto 10px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;margin-bottom:12px}
.num{font:800 38px var(--display);color:var(--f3);text-align:center;line-height:1.1}
.st{text-align:center;margin:6px 0 2px;font-weight:700;font-size:17px}
.muted{color:var(--ink2);font-size:13px}
.addr{font-size:20px;line-height:1.7;font-weight:600;margin:6px 0}
.btn{min-height:54px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:0 14px;font-weight:700;font-size:16px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;width:100%;box-sizing:border-box}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary);min-height:60px;font-size:18px}
.btn[disabled]{opacity:.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cash{padding:14px;border-radius:14px;background:var(--sunk);text-align:center;font:800 24px var(--display)}
.cash small{display:block;font:500 13px var(--font);color:var(--ink2);margin-top:2px}
ul{margin:6px 0 0;padding:0 18px;line-height:1.9}
.field{min-height:48px;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:0 12px;border-radius:12px;font-size:16px;margin-top:8px}
.msg{padding:12px;border-radius:12px;background:var(--sunk);text-align:center;margin:8px 0}
.done{text-align:center;padding:30px 10px;font-size:20px;font-weight:700}
</style></head><body><div class="wrap"><img class="logo" src="assets/olv-logo-transparent.webp" alt="OLV"><div id="root"><div class="msg">جاري التحميل...</div></div>
<div style="text-align:center;padding:16px 0 6px;font-size:12px;color:var(--ink2)">© 2026 OLV. جميع الحقوق محفوظة.</div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=new URLSearchParams(location.search),id=q.get('o')||'',tk=q.get('t')||'';
let rest='',timer=null,last=null;
const stTxt={new:'⏳ المطعم عم يستلم الطلب',confirmed:'⏳ قيد التحضير',preparing:'⏳ قيد التحضير — جهّز حالك',ready:'✅ الطلب جاهز — تعال استلمه',out:'🛵 بالطريق للزبون'};
const wa=n=>{n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='962'+n.slice(1);return n};
async function get(){const r=await fetch('/api/driver-order?id='+encodeURIComponent(id)+'&t='+encodeURIComponent(tk),{cache:'no-store'});const o=await r.json().catch(()=>({}));if(!r.ok)throw Error(o.error||'تعذر التحميل');return o}
async function post(action){const dn=($('dn')||{}).value||'';if(dn)try{localStorage.setItem('olv-driver-name',dn)}catch(e){}const r=await fetch('/api/driver-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,t:tk,action,driver:dn.trim()})});const o=await r.json().catch(()=>({}));if(!r.ok)throw Error(o.error||'تعذر التحديث');return o}
function nav(o){return o.lat!=null?'https://www.google.com/maps/dir/?api=1&destination='+o.lat+','+o.lng+'&travelmode=driving':'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.address)}
function render(res){const root=$('root');
if(res.closed){clearInterval(timer);root.innerHTML=`<div class="card done">${res.order.status==='completed'?'✅ تم تسليم الطلب #'+esc(res.order.number)+'<div class="muted" style="font-weight:400;margin-top:6px">شكراً إلك. هالرابط خلص.</div>':'⛔ الطلب #'+esc(res.order.number)+' انلغى'}</div>`;return}
const o=res.order,key=o.status+'|'+o.driver;if(last===key&&$('dn')){return}last=key;
const items=o.items.map(i=>`<li>${esc(i.label)} × ${i.qty}</li>`).join('');
const act=o.status==='ready'?`<input id="dn" class="field" placeholder="اسمك (اختياري)" value="${esc(o.driver||localStorage.getItem('olv-driver-name')||'')}"><button class="btn pri" style="margin-top:10px" onclick="go('pickup',this)">استلمت الطلب · طلعت</button>`:o.status==='out'?`<button class="btn pri" onclick="if(confirm('تأكيد: استلمت المبلغ وسلّمت الطلب؟'))go('delivered',this)">✓ تم التسليم</button>`:`<div class="msg">رح يظهر زر الاستلام لما يصير الطلب جاهز. الصفحة بتتحدث لحالها.</div>`;
root.innerHTML=`<div class="card"><div class="num">#${esc(o.number)}</div><div class="st">${stTxt[o.status]||esc(o.status)}</div></div>
<div class="card"><div class="muted">عنوان التوصيل</div><div class="addr">${esc(o.address)}</div><a class="btn pri" target="_blank" rel="noopener" href="${esc(nav(o))}">🧭 ابدأ الملاحة</a>${o.lat!=null?`<div class="g2"><a class="btn" target="_blank" rel="noopener" href="https://waze.com/ul?ll=${o.lat},${o.lng}&navigate=yes">Waze</a><a class="btn" target="_blank" rel="noopener" href="${esc(o.mapUrl)}">الموقع</a></div>`:''}</div>
<div class="card"><div class="muted">الزبون</div><div style="font-size:18px;font-weight:700">${esc(o.name)}</div><div class="g2"><a class="btn" href="tel:${esc(o.phone)}">📞 اتصال</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa(o.phone)}">واتساب</a></div></div>
<div class="card"><div class="cash">${Number(o.total).toFixed(2)} د.أ<small>حصّلها نقداً من الزبون (منها توصيل ${Number(o.fee).toFixed(2)})</small></div>${o.notes?`<div class="msg">📝 ${esc(o.notes)}</div>`:''}<div class="muted" style="margin-top:10px">الطلب</div><ul>${items}</ul></div>
<div class="card">${act}${rest?`<a class="btn" style="margin-top:8px" href="tel:${esc(rest)}">📞 اتصل بالمطعم</a>`:''}</div>`}
async function go(action,btn){btn.disabled=true;try{await post(action);last=null;await load()}catch(e){alert(e.message);btn.disabled=false}}
async function load(){try{render(await get())}catch(e){clearInterval(timer);$('root').innerHTML='<div class="card done">⛔ '+esc(e.message)+'</div>'}}
fetch('data/menu.json').then(r=>r.json()).then(m=>{rest=(m.settings&&m.settings.whatsappNumber)||''}).catch(()=>{});
load();timer=setInterval(load,15000);
</script></body></html>
