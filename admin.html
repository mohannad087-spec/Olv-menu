<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLV Admin</title>
<style>
body{margin:0;background:#0a0a0a;color:#eee;font-family:Arial;padding:20px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:15px}.gold{color:#e0bd69}button{background:#1c1810;color:#e4c778;border:1px solid #715a31;border-radius:9px;padding:10px 14px;cursor:pointer}.card{background:#131313;border:1px solid #292929;border-radius:15px;padding:15px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr 120px 90px;gap:10px;align-items:center}input,textarea{background:#1b1b1b;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row>*:nth-child(3){grid-column:1}.row>*:nth-child(4){grid-column:2}}
.note{color:#999;font-size:13px;line-height:1.7}
</style></head><body><div class="wrap"><div class="top"><div><h1 class="gold">OLV Menu Admin</h1><div class="note">نسخة أولية للإدارة — التعديل هنا محلي في المتصفح. في نسخة الإنتاج سنربطها بقاعدة البيانات.</div></div><button onclick="location.href='index.html'">عرض المنيو</button></div><div id="app"></div></div>
<script>
let data;
async function init(){data=await fetch("data/menu.json").then(r=>r.json());render()}
function render(){let h="<div class='card'><h2 class='gold'>الأصناف والأسعار</h2><p class='note'>عدّل الاسم والسعر ثم اضغط حفظ. هذه النسخة لا ترفع التعديلات للسيرفر بعد.</p></div>";h+=data.items.map((i,n)=>`<div class='card'><div class='row'><input value="${esc(i.ar)}" oninput="data.items[${n}].ar=this.value"><input dir='ltr' value="${esc(i.en)}" oninput="data.items[${n}].en=this.value"><input type='number' step='.25' value="${i.price}" oninput="data.items[${n}].price=Number(this.value)"><button onclick="data.items[${n}].popular=!data.items[${n}].popular;render()">⭐ ${i.popular?"Popular":"Normal"}</button></div></div>`).join("");h+="<button onclick='save()'>حفظ نسخة JSON</button>";document.getElementById("app").innerHTML=h}
function esc(s){return s.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
function save(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="menu.json";a.click();alert("تم تنزيل menu.json. في الإنتاج سيتم الحفظ مباشرة من لوحة الإدارة.");}
init();
</script></body></html>
