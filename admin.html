<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLV Admin</title>
<style>
body{margin:0;background:#0a0a0a;color:#eee;font-family:Arial;padding:20px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #292929;padding-bottom:15px}.gold{color:#e0bd69}button{background:#1c1810;color:#e4c778;border:1px solid #715a31;border-radius:9px;padding:10px 14px;cursor:pointer}.card{background:#131313;border:1px solid #292929;border-radius:15px;padding:15px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr 120px 110px;gap:10px;align-items:center}input{background:#1b1b1b;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}.note{color:#999;font-size:13px;line-height:1.7}.status{font-size:11px;padding:7px 9px;border-radius:999px;border:1px solid #333;text-align:center}.on{color:#b9d69b;border-color:#425532;background:#182016}.off{color:#d58d8d;border-color:#5a3434;background:#241818}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row>*:nth-child(3),.row>*:nth-child(4){grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><h1 class="gold">OLV Menu Admin</h1><div class="note">تعديل الأسعار، الأسماء، التوفر، Popular ورقم واتساب. الحفظ هنا ينزّل ملف JSON فقط؛ لا يتم الرفع إلى GitHub تلقائياً.</div></div><button onclick="location.href='index.html'">عرض المنيو</button></div><div class="card"><h2 class="gold">إعدادات الطلب</h2><input id="wa" inputmode="tel" placeholder="رقم واتساب بصيغة دولية، مثال: 9627xxxxxxxx"><p class="note">اتركه فارغاً إذا لم يتم اعتماد رقم واتساب بعد.</p><div class="actions"><button onclick="saveSettings()">حفظ الإعدادات في الملف</button></div></div><div id="app"></div></div>
<script>
let data;
async function init(){data=await fetch("data/menu.json",{cache:"no-store"}).then(r=>r.json());document.getElementById('wa').value=data.settings.whatsappNumber||'';render()}
function render(){let h="<div class='card'><h2 class='gold'>الأصناف</h2><p class='note'>يمكن إخفاء الصنف من الشراء بوضعه غير متوفر، بدون حذفه من الملف.</p></div>";h+=data.items.map((i,n)=>`<div class='card'><div class='row'><input value="${esc(i.ar)}" oninput="data.items[${n}].ar=this.value"><input dir='ltr' value="${esc(i.en)}" oninput="data.items[${n}].en=this.value"><input type='number' step='.25' value="${i.price}" oninput="data.items[${n}].price=Number(this.value)"><button class='status ${i.available===false?'off':'on'}' onclick="data.items[${n}].available=data.items[${n}].available===false;render()">${i.available===false?'غير متوفر':'متوفر'}</button></div><div style='margin-top:10px'><button onclick="data.items[${n}].popular=!data.items[${n}].popular;render()">⭐ ${i.popular?'Popular':'Normal'}</button></div></div>`).join('');h+="<div class='actions'><button onclick='save()'>تنزيل menu.json بعد التعديل</button><button onclick='restoreFromServer()'>إعادة تحميل من السيرفر</button></div>";document.getElementById('app').innerHTML=h}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function saveSettings(){data.settings.whatsappNumber=document.getElementById('wa').value.trim();save()}
function save(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);alert('تم تنزيل menu.json. ارفع الملف إلى GitHub لاستمرار التعديل في المنيو المنشورة.')}
function restoreFromServer(){init()}
init();
</script></body></html>
