<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060606"><title>OLV — متابعة الطلب</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#4a2c0b,#100c07 35%,#050505 75%);color:#fff9ed;font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:680px;margin:auto;padding:25px 15px 50px}.logo{display:block;width:120px;height:120px;object-fit:contain;margin:10px auto 18px;border-radius:18px}.card{border:1px solid #5f4928;border-radius:26px;background:linear-gradient(160deg,#17130e,#0b0b0a);padding:22px;box-shadow:0 30px 90px #000}.kicker{color:#bf9a50;font-size:11px;letter-spacing:2px}.title{color:#f4d47e;font:700 31px Georgia,serif;margin:5px 0}.muted{color:#aaa095;font-size:12px;line-height:1.8}.status{margin:22px 0 16px}.badge{display:inline-block;padding:9px 13px;border-radius:999px;border:1px solid #86652f;color:#f4d47e;background:#1c150b;font-weight:900}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.step{min-height:64px;border:1px solid #342d23;border-radius:14px;background:#111;text-align:center;padding:8px;font-size:10px;color:#777}.step.on{border-color:#9f7735;background:#241a0d;color:#f0d184}.info{margin-top:18px;padding:15px;border:1px solid #302a22;border-radius:16px}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #29231d;padding:9px 0;font-size:12px}.row:last-child{border-bottom:0}.value{color:#ead59f;text-align:left}.refresh{width:100%;margin-top:18px;padding:13px;border-radius:13px;background:linear-gradient(135deg,#9b7026,#f0ca6c);border:1px solid #f0d27e;color:#181007;font-weight:900}@media(max-width:520px){.steps{grid-template-columns:1fr 1fr 1fr}.step:last-child{grid-column:2}.logo{width:100px;height:100px}}</style></head><body><div class="wrap"><img class="logo" src="assets/olv-original.jpg" alt="OLV"><div class="card"><div class="kicker">OLV · ORDER TRACKING</div><div class="title">متابعة طلبك</div><div id="statusText" class="muted">جاري تحميل حالة الطلب...</div><div class="status"><span id="statusBadge" class="badge">...</span></div><div id="steps" class="steps"></div><div class="info" id="info"></div><button class="refresh" onclick="load()">تحديث الحالة</button></div></div><script>const id=new URLSearchParams(location.search).get('id');const labels=[['new','تم الاستلام'],['confirmed','تم التأكيد'],['preparing','قيد التحضير'],['ready','جاهز'],['completed','مكتمل']];const texts={new:'استلمنا طلبك ونراجعه الآن.',confirmed:'تم تأكيد الطلب من OLV.',preparing:'طلبك قيد التحضير.',ready:'طلبك جاهز.',completed:'تم إكمال الطلب. شكراً لاختيار OLV.',cancelled:'تم إلغاء الطلب.'};const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));function money(n){return Number(n||0).toFixed(2)+' د.أ'}async function load(){if(!id){$('statusText').textContent='رابط الطلب غير مكتمل.';return}try{const r=await fetch('/api/orders?id='+encodeURIComponent(id)+'&ts='+Date.now(),{cache:'no-store'});const out=await r.json();if(!r.ok)throw Error(out.error||'تعذر تحميل الطلب');const o=out.order;$('statusText').textContent=texts[o.status]||o.status;$('statusBadge').textContent=o.status==='cancelled'?'ملغى':'طلب #'+o.number;$('steps').innerHTML=labels.map(x=>{const idx=labels.findIndex(a=>a[0]===o.status),me=labels.findIndex(a=>a[0]===x[0]);return `<div class="step ${idx>=0&&me<=idx?'on':''}">${x[1]}</div>`}).join('');$('info').innerHTML=`<div class="row"><span>طريقة الطلب</span><span class="value">${o.mode==='hall'?'داخل الكافيه':'توصيل'}</span></div>${o.table?`<div class="row"><span>الطاولة</span><span class="value">${esc(o.table)}</span></div>`:''}${o.address?`<div class="row"><span>العنوان</span><span class="value">${esc(o.address)}</span></div>`:''}<div class="row"><span>عدد السطور</span><span class="value">${o.items.length}</span></div><div class="row"><span>المجموع</span><span class="value">${money(o.total)}</span></div><div class="row"><span>آخر تحديث</span><span class="value">${new Date(o.updatedAt).toLocaleString('ar-JO')}</span></div>`}catch(e){$('statusText').textContent=e.message}}load();setInterval(load,15000);</script></body></html>
