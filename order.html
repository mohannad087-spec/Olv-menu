<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1b18"><title>OLV — متابعة الطلب</title><link rel="preload" href="assets/fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/olv-theme.css?v=a4"><script>(function(){try{var h=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Amman",hour:"2-digit",hourCycle:"h23"}).format(new Date())),l=h>=6&&h<18;document.documentElement.dataset.olvTheme=l?"light":"dark";document.addEventListener("DOMContentLoaded",function(){document.body.classList.toggle("olv-light",l)});var m=document.querySelector("meta[name=theme-color]");if(m)m.content=l?"#efede9":"#1d1b18"}catch(e){}})()</script><style>
.wrap{max-width:560px;margin:auto;padding:18px 16px 56px}
.logo{display:block;height:64px;width:auto;max-width:60%;object-fit:contain;margin:6px auto 22px}
.card{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:22px 20px}
.title{font:500 30px/1.3 var(--display);color:var(--ink);margin:0 0 4px}
.muted{color:var(--ink2);font-size:15px;line-height:1.8}
.status{margin:20px 0 14px}
.status .badge{position:static;display:inline-flex;align-items:center;min-height:36px;font-size:14px;padding:0 14px;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:600;font-size:14px}
.steps{display:grid;gap:0;margin:6px 0 0;position:relative}
.step{position:relative;display:flex;align-items:center;gap:14px;min-height:44px;color:var(--ink2);font-size:15px}
.step:before{content:"";flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1}
.step:not(:last-child):after{content:"";position:absolute;inset-inline-start:6px;top:29px;height:30px;width:2px;background:var(--line)}
.step.on{color:var(--ink)}
.step.on:before{background:var(--f3);border-color:var(--f3)}
.step.on:not(:last-child):after{background:var(--f3)}
.step.now{font-weight:600}
.step.now:before{box-shadow:0 0 0 4px color-mix(in srgb,var(--f3) 25%,transparent)}
.info{margin-top:20px;padding:4px 0 0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:12px 0;font-size:15px;color:var(--ink2)}
.row:last-child{border-bottom:0}
.value{color:var(--ink);text-align:left;font-weight:500}
.refresh{display:block;width:100%;min-height:48px;margin-top:18px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:15px}
.refresh:disabled{opacity:.6}
.bell{display:block;width:100%;min-height:48px;margin-top:10px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:15px}
.bell:disabled{color:var(--ink2)}
#alertStack{position:fixed;top:10px;left:10px;right:10px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:auto}
.ready-alert{background:var(--wa);color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 25%,transparent);animation:readyIn .4s ease both}
.ready-alert button{min-height:44px;border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:10px;padding:0 14px;font-weight:600;white-space:nowrap}
@keyframes readyIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.rating{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--sunk);text-align:center}
.rating h3{margin:0 0 10px;color:var(--ink);font:600 16px var(--font)}
.stars{display:flex;justify-content:center;gap:2px;margin-bottom:10px}
.stars span{cursor:pointer;color:var(--line);font-size:34px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.stars span.on{color:var(--f2)}
.rating textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;resize:vertical;margin-bottom:10px;font-size:16px}
.rating button{display:block;width:100%;min-height:48px;border-radius:12px;background:var(--primary);color:var(--on-primary);border:0;font-weight:600}
.points-chip{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:500;font-size:14px}
.foot{text-align:center;padding:16px 0 4px;font-size:12px;color:var(--ink2)}
</style></head><body><div class="wrap"><div><button class="olv-back" data-back="index.html"></button></div><img class="logo" src="assets/olv-logo-transparent.webp" alt="OLV"><div class="card"><div class="title">متابعة طلبك</div><div id="statusText" class="muted">جاري تحميل حالة الطلب...</div><div class="status"><span id="statusBadge" class="badge">...</span></div><div id="steps" class="steps"></div><div class="info" id="info"></div><div id="pointsBox"></div><button class="refresh" onclick="load()">تحديث الحالة</button><button class="bell" id="bellBtn" onclick="enableBell()">فعّل تنبيه لما يصير طلبك جاهز</button><div id="ratingBox" style="display:none"></div></div><div class="foot">© 2026 OLV. جميع الحقوق محفوظة.</div></div>
<div id="alertStack"></div><script src="assets/back-nav.js"></script><script>const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');const labels=[['new','تم الاستلام'],['confirmed','تم التأكيد'],['preparing','قيد التحضير'],['ready','جاهز'],['completed','مكتمل']];const texts={new:'استلمنا طلبك ونراجعه الآن.',confirmed:'تم تأكيد الطلب من OLV.',preparing:'طلبك قيد التحضير.',ready:'طلبك جاهز.',completed:'تم إكمال الطلب. شكراً لاختيار OLV.',cancelled:'تم إلغاء الطلب.'};const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));function money(n){return Number(n||0).toFixed(2)+' د.أ'}
let audioCtx=null,prevStatus=null;
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(freq,delay,dur){setTimeout(()=>{try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur+.05)}catch(e){}},delay)}
function syncBellButton(){
  const supported='Notification' in window,perm=supported?Notification.permission:'unsupported';
  if(perm==='granted'){$('bellBtn').textContent='التنبيه مفعّل';$('bellBtn').disabled=true}
  else if(perm==='denied'){$('bellBtn').textContent='التنبيهات موقوفة من إعدادات المتصفح';$('bellBtn').disabled=true}
  else{$('bellBtn').textContent='فعّل تنبيه لما يصير طلبك جاهز';$('bellBtn').disabled=false}
}
function enableBell(){
  ensureAudio();beep(880,0,.3);
  try{if('Notification' in window && Notification.permission==='default')Notification.requestPermission().then(syncBellButton)}catch(e){}
  syncBellButton();
}
document.addEventListener('click',ensureAudio);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ensureAudio();load()}});
window.addEventListener('focus',load);
function notifyReady(o){
  if(audioCtx){beep(880,0,.45);beep(1046,250,.4)}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const n=new Notification('OLV — طلبك جاهز 🔔',{body:'طلب #'+o.number+' جاهز، تفضل لاستلامه.',icon:'assets/olv-original.jpg'});
      n.onclick=()=>{try{window.focus()}catch(e){}n.close()};
    }
  }catch(e){}
  const el=document.createElement('div');
  el.className='ready-alert';
  el.innerHTML=`<b>طلبك #${o.number} جاهز — تفضل استلمه!</b><button>تمام ✓</button>`;
  el.querySelector('button').onclick=()=>el.remove();
  $('alertStack').appendChild(el);
}
let selectedStars=0,pointsLoadedFor='';
function renderStars(){$('stars').innerHTML=[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=selectedStars?'on':''}">★</span>`).join('');$('stars').querySelectorAll('span').forEach(s=>s.onclick=()=>{selectedStars=Number(s.dataset.n);renderStars()})}
function renderRatingBox(o){
  const box=$('ratingBox');
  if(o.status!=='completed'){box.style.display='none';return}
  box.style.display='block';
  if(o.rating){box.innerHTML=`<div class="rating"><h3>شكراً لتقييمك! ${'★'.repeat(o.rating.stars)}${'☆'.repeat(5-o.rating.stars)}</h3></div>`;return}
  if(!box.querySelector('.stars')){
    box.innerHTML=`<div class="rating"><h3>كيف كانت تجربتك؟</h3><div class="stars" id="stars"></div><textarea id="ratingComment" rows="2" placeholder="أي ملاحظات؟ (اختياري)"></textarea><button onclick="submitRating('${o.id}')">إرسال التقييم</button></div>`;
    renderStars();
  }
}
async function submitRating(orderId){
  if(!selectedStars){alert('اختَر عدد النجوم أولاً');return}
  try{
    const r=await fetch('/api/rate-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId,stars:selectedStars,comment:$('ratingComment').value.trim()})});
    const out=await r.json();
    if(!r.ok||!out.ok)throw Error(out.error||'تعذر إرسال التقييم');
    load();
  }catch(e){alert(e.message)}
}
async function loadPoints(phone){
  if(!phone||pointsLoadedFor===phone)return;
  pointsLoadedFor=phone;
  try{
    const r=await fetch('/api/loyalty?phone='+encodeURIComponent(phone)+'&ts='+Date.now());
    const out=await r.json();
    if(out.ok)$('pointsBox').innerHTML=`<div class="points-chip">عندك ${out.points} نقطة (نقطة عن كل دينار)</div>`;
  }catch(e){}
}
let loadSeq=0,loadInFlight=false,retryTimer=null;
function showRefreshErr(msg){
  let el=document.getElementById('refreshErr');
  if(!el){el=document.createElement('div');el.id='refreshErr';el.style.cssText='margin-top:9px;padding:10px 13px;border:1px solid var(--f0);background:var(--sunk);color:var(--ink);border-radius:12px;font-size:14px;text-align:center;line-height:1.7';document.querySelector('.refresh').insertAdjacentElement('afterend',el)}
  el.textContent='تعذر تحديث الحالة الآن'+(msg?' — '+msg:'')+'. عم نعيد المحاولة تلقائياً...';
}
function hideRefreshErr(){const el=document.getElementById('refreshErr');if(el)el.remove()}
async function load(){
  if(!id){$('statusText').textContent='رابط الطلب غير مكتمل.';return}
  if(loadInFlight)return;
  loadInFlight=true;
  const seq=++loadSeq,btn=document.querySelector('.refresh');
  if(btn){btn.disabled=true;btn.textContent='جاري التحديث...'}
  try{
    const r=await fetch('/api/orders?id='+encodeURIComponent(id)+'&ts='+Date.now(),{cache:'no-store'});
    const out=await r.json();
    if(!r.ok)throw Error(out.error||'تعذر تحميل الطلب');
    if(seq!==loadSeq)return;
    const o=out.order;
    if(prevStatus&&prevStatus!=='ready'&&o.status==='ready')notifyReady(o);
    prevStatus=o.status;
    $('statusText').textContent=texts[o.status]||o.status;
    $('statusBadge').textContent=o.status==='cancelled'?'ملغى':'طلب #'+o.number;
    $('steps').innerHTML=labels.map(x=>{const idx=labels.findIndex(a=>a[0]===o.status),me=labels.findIndex(a=>a[0]===x[0]);return `<div class="step ${idx>=0&&me<=idx?'on':''} ${me===idx?'now':''}">${x[1]}</div>`}).join('');
    $('info').innerHTML=`<div class="row"><span>طريقة الطلب</span><span class="value">${o.mode==='hall'?'داخل الكافيه':(o.mode==='takeaway'?'سفري':'توصيل')}</span></div>${o.name?`<div class="row"><span>الاسم</span><span class="value">${esc(o.name)}</span></div>`:''}${o.table?`<div class="row"><span>الطاولة</span><span class="value">${esc(o.table)}</span></div>`:''}${o.address?`<div class="row"><span>العنوان</span><span class="value">${esc(o.address)}</span></div>`:''}<div class="row"><span>عدد السطور</span><span class="value">${o.items.length}</span></div><div class="row"><span>المجموع</span><span class="value">${money(o.total)}</span></div><div class="row"><span>آخر تحديث</span><span class="value">${new Date(o.updatedAt).toLocaleString('ar-JO')}</span></div>`;
    renderRatingBox(o);
    if(o.phone)loadPoints(o.phone);
    hideRefreshErr();
    if(retryTimer){clearTimeout(retryTimer);retryTimer=null}
  }catch(e){
    if(seq===loadSeq){
      showRefreshErr(e.message);
      if(retryTimer)clearTimeout(retryTimer);
      retryTimer=setTimeout(load,4000);
    }
  }finally{
    if(seq===loadSeq&&btn){btn.disabled=false;btn.textContent='تحديث الحالة'}
    loadInFlight=false;
  }
}
syncBellButton();load();setInterval(load,10000);</script></body></html>
