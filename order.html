<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060606"><title>OLV — متابعة الطلب</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#3a2a18,#20170f 30%,#160f0a 75%);color:#fff9ed;font-family:"Cairo",Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:680px;margin:auto;padding:25px 15px 50px}.logo{display:block;width:120px;height:120px;object-fit:contain;margin:10px auto 18px;border-radius:18px}.card{border:1px solid #5f4928;border-radius:26px;background:linear-gradient(160deg,#17130e,#0b0b0a);padding:22px;box-shadow:0 30px 90px #000}.kicker{color:#bf9a50;font-size:11px;letter-spacing:2px}.title{color:#c89a5e;font:700 31px "Cairo",Georgia,serif;margin:5px 0}.muted{color:#aaa095;font-size:12px;line-height:1.8}.status{margin:22px 0 16px}.badge{display:inline-block;padding:9px 13px;border-radius:999px;border:1px solid #86652f;color:#c89a5e;background:#1c150b;font-weight:900}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.step{min-height:64px;border:1px solid #342d23;border-radius:14px;background:#111;text-align:center;padding:8px;font-size:10px;color:#777}.step.on{border-color:#9f7735;background:#241a0d;color:#c89a5e}.info{margin-top:18px;padding:15px;border:1px solid #302a22;border-radius:16px}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #29231d;padding:9px 0;font-size:12px}.row:last-child{border-bottom:0}.value{color:#ead59f;text-align:left}.refresh{width:100%;margin-top:18px;padding:13px;border-radius:13px;background:linear-gradient(135deg,#7d5a34,#c89a5e);border:1px solid #c9a05f;color:#201408;font-weight:900}
.bell{width:100%;margin-top:9px;padding:12px;border-radius:13px;background:#171717;border:1px solid #4a3a25;color:#f4d47e;font-weight:900}
#alertStack{position:fixed;top:10px;left:10px;right:10px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:640px;margin:auto}
.ready-alert{background:linear-gradient(135deg,#1b562d,#267642);border:1px solid #65b47a;color:#f2fff5;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:readyIn .4s ease both}
.ready-alert button{border:1px solid #d8ffe0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:8px 12px;font-weight:900;white-space:nowrap}
@keyframes readyIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.rating{margin-top:18px;padding:16px;border:1px solid #5f4928;border-radius:18px;background:linear-gradient(160deg,#1a150e,#0c0b0a);text-align:center}
.rating h3{margin:0 0 10px;color:#c89a5e;font-size:15px}
.stars{display:flex;justify-content:center;gap:6px;font-size:34px;margin-bottom:10px}
.stars span{cursor:pointer;color:#3a3125;transition:color .15s}
.stars span.on{color:#e6b85c}
.rating textarea{width:100%;background:#111;border:1px solid #342f28;color:#fff;border-radius:12px;padding:11px;resize:vertical;margin-bottom:10px}
.rating button{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,#7d5a34,#c89a5e);border:1px solid #c9a05f;color:#201408;font-weight:900}
.points-chip{display:inline-block;margin-top:12px;padding:9px 14px;border-radius:999px;border:1px solid #6a532c;background:#1c150b;color:#e6c98a;font-weight:900;font-size:12px}
@media(max-width:520px){.steps{grid-template-columns:1fr 1fr 1fr}.step:last-child{grid-column:2}.logo{width:100px;height:100px}}</style></head><body><div class="wrap"><img class="logo" src="assets/olv-original.jpg" alt="OLV"><div class="card"><div class="kicker">OLV · ORDER TRACKING</div><div class="title">متابعة طلبك</div><div id="statusText" class="muted">جاري تحميل حالة الطلب...</div><div class="status"><span id="statusBadge" class="badge">...</span></div><div id="steps" class="steps"></div><div class="info" id="info"></div><div id="pointsBox"></div><button class="refresh" onclick="load()">تحديث الحالة</button><button class="bell" id="bellBtn" onclick="enableBell()">🔔 فعّل تنبيه لما يصير طلبك جاهز</button><div id="ratingBox" style="display:none"></div></div></div>
<div id="alertStack"></div><script>const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');const labels=[['new','تم الاستلام'],['confirmed','تم التأكيد'],['preparing','قيد التحضير'],['ready','جاهز'],['completed','مكتمل']];const texts={new:'استلمنا طلبك ونراجعه الآن.',confirmed:'تم تأكيد الطلب من OLV.',preparing:'طلبك قيد التحضير.',ready:'طلبك جاهز.',completed:'تم إكمال الطلب. شكراً لاختيار OLV.',cancelled:'تم إلغاء الطلب.'};const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));function money(n){return Number(n||0).toFixed(2)+' د.أ'}
let audioCtx=null,prevStatus=null;
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(freq,delay,dur){setTimeout(()=>{try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur+.05)}catch(e){}},delay)}
function enableBell(){ensureAudio();beep(880,0,.3);$('bellBtn').textContent='🔔 التنبيه مفعّل';$('bellBtn').disabled=true}
document.addEventListener('click',ensureAudio);
function notifyReady(o){
  if(audioCtx){beep(880,0,.45);beep(1046,250,.4)}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  const el=document.createElement('div');
  el.className='ready-alert';
  el.innerHTML=`<b>🔔 طلبك #${o.number} جاهز — تفضل استلمه!</b><button>تمام ✓</button>`;
  el.querySelector('button').onclick=()=>el.remove();
  $('alertStack').appendChild(el);
}
let selectedStars=0,pointsLoadedFor='';
function renderStars(){$('stars').innerHTML=[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=selectedStars?'on':''}">★</span>`).join('');$('stars').querySelectorAll('span').forEach(s=>s.onclick=()=>{selectedStars=Number(s.dataset.n);renderStars()})}
function renderRatingBox(o){
  const box=$('ratingBox');
  if(o.status!=='completed'){box.style.display='none';return}
  box.style.display='block';
  if(o.rating){box.innerHTML=`<div class="rating"><h3>شكراً لتقييمك! ⭐️ ${'★'.repeat(o.rating.stars)}${'☆'.repeat(5-o.rating.stars)}</h3></div>`;return}
  if(!box.querySelector('.stars')){
    box.innerHTML=`<div class="rating"><h3>كيف كانت تجربتك؟</h3><div class="stars" id="stars"></div><textarea id="ratingComment" rows="2" placeholder="أي ملاحظات؟ (اختياري)"></textarea><button onclick="submitRating('${o.id}')">إرسال التقييم</button></div>`;
    renderStars();
  }
}
async function submitRating(orderId){
  if(!selectedStars){alert('اختَر عدد النجوم أولاً');return}
  try{
    const r=await fetch('/api/rate-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId,stars:selectedStars,comment:$('ratingComment').value.trim()})});
    const out=await r.json();
    if(!r.ok||!out.ok)throw Error(out.error||'تعذر إرسال التقييم');
    load();
  }catch(e){alert(e.message)}
}
async function loadPoints(phone){
  if(!phone||pointsLoadedFor===phone)return;
  pointsLoadedFor=phone;
  try{
    const r=await fetch('/api/loyalty?phone='+encodeURIComponent(phone)+'&ts='+Date.now());
    const out=await r.json();
    if(out.ok)$('pointsBox').innerHTML=`<div class="points-chip">🎁 عندك ${out.points} نقطة (نقطة عن كل دينار)</div>`;
  }catch(e){}
}
async function load(){if(!id){$('statusText').textContent='رابط الطلب غير مكتمل.';return}try{const r=await fetch('/api/orders?id='+encodeURIComponent(id)+'&ts='+Date.now(),{cache:'no-store'});const out=await r.json();if(!r.ok)throw Error(out.error||'تعذر تحميل الطلب');const o=out.order;if(prevStatus&&prevStatus!=='ready'&&o.status==='ready')notifyReady(o);prevStatus=o.status;$('statusText').textContent=texts[o.status]||o.status;$('statusBadge').textContent=o.status==='cancelled'?'ملغى':'طلب #'+o.number;$('steps').innerHTML=labels.map(x=>{const idx=labels.findIndex(a=>a[0]===o.status),me=labels.findIndex(a=>a[0]===x[0]);return `<div class="step ${idx>=0&&me<=idx?'on':''}">${x[1]}</div>`}).join('');$('info').innerHTML=`<div class="row"><span>طريقة الطلب</span><span class="value">${o.mode==='hall'?'داخل الكافيه':'توصيل'}</span></div>${o.table?`<div class="row"><span>الطاولة</span><span class="value">${esc(o.table)}</span></div>`:''}${o.address?`<div class="row"><span>العنوان</span><span class="value">${esc(o.address)}</span></div>`:''}<div class="row"><span>عدد السطور</span><span class="value">${o.items.length}</span></div><div class="row"><span>المجموع</span><span class="value">${money(o.total)}</span></div><div class="row"><span>آخر تحديث</span><span class="value">${new Date(o.updatedAt).toLocaleString('ar-JO')}</span></div>`;renderRatingBox(o);if(o.phone)loadPoints(o.phone)}catch(e){$('statusText').textContent=e.message}}load();setInterval(load,15000);</script></body></html>
