<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLV — نسخة المنيو للطباعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf5e9;--ink:#241a10;--muted:#8a7a5f;--gold:#9c6b26;--gold2:#c9a05f;--line:#ddcda3;--olive:#5b7a4c}
*{box-sizing:border-box}
html{background:#e9e2d0}
body{margin:0;background:#e9e2d0;color:var(--ink);font-family:"Cairo",Arial,"Noto Sans Arabic",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:14px;background:#1c140f;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toolbar button{border:1px solid #c89a5e;background:linear-gradient(135deg,#7d5a34,#c89a5e);color:#201408;font-weight:900;border-radius:12px;padding:11px 24px;font-size:14px;cursor:pointer;font-family:"Cairo",inherit}
.toolbar button.ghost{background:#241b14;color:#c89a5e}

.page{max-width:800px;margin:28px auto;background:var(--paper);box-shadow:0 30px 70px rgba(0,0,0,.28);position:relative}
.frame{border:2px solid var(--gold2);outline:1px solid var(--gold2);outline-offset:6px;margin:14px;padding:38px 42px 46px;position:relative}
.corner-tl,.corner-tr,.corner-bl,.corner-br{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--gold);opacity:.85}
.corner-tl{top:-10px;right:-10px;border-left:0;border-bottom:0}
.corner-tr{top:-10px;left:-10px;border-right:0;border-bottom:0}
.corner-bl{bottom:-10px;right:-10px;border-left:0;border-top:0}
.corner-br{bottom:-10px;left:-10px;border-right:0;border-top:0}

.brandhead{text-align:center;margin-bottom:8px}
.brandhead img{width:92px;height:92px;object-fit:contain;border-radius:16px;margin-bottom:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.brandhead h1{margin:0;font:700 46px "Amiri",Georgia,serif;letter-spacing:2px;color:var(--ink)}
.brandhead .sub{margin:4px 0 0;font:400 12px "Cairo",sans-serif;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
.brandhead .tagline{margin:10px 0 0;font-size:13px;color:var(--muted)}

.rule{display:flex;align-items:center;gap:14px;margin:22px 0 30px}
.rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2) 20%,var(--gold2) 80%,transparent)}
.rule i{color:var(--gold);font-size:15px;font-style:normal;transform:rotate(45deg);display:inline-block}

.section{margin-bottom:8px}
.section + .section{margin-top:34px}
.section-title{text-align:center;margin:0 0 4px}
.section-title b{font:700 24px "Amiri",Georgia,serif;color:var(--gold);letter-spacing:1px}
.section-rule{display:flex;align-items:center;gap:10px;margin:8px 0 22px}
.section-rule span{flex:1;height:1px;background:var(--line)}
.section-rule i{width:6px;height:6px;background:var(--gold2);transform:rotate(45deg);display:inline-block}

.section-cats{column-count:2;column-gap:42px}
.cat{break-inside:avoid;margin-bottom:24px}
.cat h3{margin:0 0 10px;font:700 15px "Cairo",sans-serif;color:var(--olive);letter-spacing:.5px;position:relative;padding-bottom:6px}
.cat h3:after{content:"";position:absolute;right:0;bottom:0;width:30px;height:2px;background:var(--gold2)}

.row{margin-bottom:11px}
.row-top{display:flex;align-items:baseline}
.row .name{font-weight:700;font-size:14px;white-space:nowrap;color:var(--ink)}
.row .star{color:var(--gold);margin-inline-end:3px;font-size:12px}
.row .dtag{font-size:11px;margin-inline-start:3px}
.leader{flex:1 1 auto;border-bottom:1px dotted var(--muted);margin:0 6px;position:relative;top:-4px;min-width:8px}
.row .price{white-space:nowrap;font-weight:800;font-size:13.5px;color:var(--gold)}
.row .price small{font-weight:600;font-size:9px;color:var(--muted);margin-inline-start:2px}
.row .en{font-size:10px;color:var(--muted);margin-top:1px}

.foot{margin-top:8px;text-align:center}
.foot .rule{margin:30px 0 16px}
.foot p{margin:0;font-size:11px;color:var(--muted);line-height:1.9}
.foot .thanks{font:700 16px "Amiri",Georgia,serif;color:var(--gold);margin-bottom:6px}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}

@media (max-width:680px){
  .section-cats{column-count:1}
  .frame{padding:26px 20px 34px;margin:8px}
  .brandhead h1{font-size:36px}
}

@media print{
  @page{margin:14mm}
  .toolbar{display:none}
  html,body{background:#fff}
  .page{box-shadow:none;margin:0;max-width:none}
  .frame{outline:none;border:none;margin:0;padding:0}
  .corner-tl,.corner-tr,.corner-bl,.corner-br{display:none}
  .section{break-before:page}
  .section:first-child{break-before:auto}
  .section-cats{column-gap:38px}
  .cat{break-inside:avoid}
}
</style>
</head>
<body>
<div class="toolbar">
<button onclick="window.print()">🖨️ طباعة</button>
<button class="ghost" onclick="location.href='admin.html'">رجوع للإدارة</button>
</div>

<div class="page">
<div class="frame">
<span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>

<div class="brandhead">
<img src="assets/olv-original.jpg" alt="OLV">
<h1>OLV</h1>
<div class="sub">LUXURY CAFÉ &amp; RESTAURANT</div>
<div class="tagline" id="tagline">مطعم وكافيه</div>
</div>
<div class="rule"><span></span><i>◆</i><span></span></div>

<div id="body"><div class="empty">جاري تحميل المنيو...</div></div>

<div class="foot">
<div class="rule"><span></span><i>◆</i><span></span></div>
<div class="thanks">بالهنا والشفا</div>
<p>الأسعار بالدينار الأردني وقابلة للتغيير دون إشعار مسبق<br><span id="wa"></span></p>
</div>

</div>
</div>

<script>
const $=id=>document.getElementById(id);
function tagBadges(i){const t=i.tags||[];let h='';if(t.includes('veg'))h+='<span class="dtag" title="نباتي">🌱</span>';if(t.includes('spicy'))h+='<span class="dtag" title="حار">🌶️</span>';return h}
const GROUPS=[
  {title:'المقبلات والأطباق الرئيسية',cats:['burgers','snacks','sandwiches','pasta','salads']},
  {title:'المشروبات',cats:['hot','cold','juices','shakes']},
  {title:'الحلويات',cats:['desserts','icecream','donuts']},
  {title:'الأرجيلة',cats:['shisha']}
];
function row(i){
  const price=Number(i.price).toFixed(2);
  return `<div class="row">
    <div class="row-top">
      <span class="name">${i.popular?'<span class="star">★</span>':''}${i.ar}${tagBadges(i)}</span>
      <span class="leader"></span>
      <span class="price">${price}<small>د.أ</small></span>
    </div>
    ${i.en?`<div class="en">${i.en}</div>`:''}
  </div>`;
}
async function init(){
  try{
    const DATA=await fetch('data/menu.json',{cache:'no-store'}).then(r=>r.json());
    $('tagline').textContent=DATA.settings?.taglineAr||'مطعم وكافيه';
    $('wa').textContent=DATA.settings?.whatsappNumber?('للطلب والتواصل: '+DATA.settings.whatsappNumber):'';
    const catMap=new Map(DATA.categories.map(c=>[c.id,c]));
    let html='';
    GROUPS.forEach(g=>{
      let catsHtml='';
      g.cats.forEach(catId=>{
        const cat=catMap.get(catId);
        if(!cat)return;
        const items=DATA.items.filter(i=>i.cat===catId&&i.available!==false);
        if(!items.length)return;
        catsHtml+=`<div class="cat"><h3>${cat.ar}</h3>${items.map(row).join('')}</div>`;
      });
      if(!catsHtml)return;
      html+=`<div class="section"><div class="section-title"><b>${g.title}</b></div><div class="section-rule"><span></span><i></i><span></span></div><div class="section-cats">${catsHtml}</div></div>`;
    });
    $('body').innerHTML=html||'<div class="empty">لا توجد أصناف متاحة حالياً.</div>';
  }catch(e){
    $('body').innerHTML='<div class="empty">تعذر تحميل المنيو.</div>';
  }
}
init();
</script>
</body>
</html>
