<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLV — نسخة المنيو للطباعة</title>
<style>
@font-face{font-family:"Readex Pro";font-weight:160 700;font-display:swap;src:url(assets/fonts/readex-pro-arabic-wght-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:"Readex Pro";font-weight:160 700;font-display:swap;src:url(assets/fonts/readex-pro-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Reem Kufi";font-weight:500;font-display:swap;src:url(assets/fonts/reem-kufi-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Reem Kufi";font-weight:500;font-display:swap;src:url(assets/fonts/reem-kufi-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
/* المنيو المطبوع بهوية المنيو الجديد: حجر ترافرتين، حبر غامق، زيتوني، وصور الأصناف */
:root{--paper:#f5f0e7;--stone:#ebe3d5;--ink:#25231f;--muted:#6b6458;--olive:#56663a;--line:#d9cfbd;--display:"Reem Kufi","Readex Pro",sans-serif}
*{box-sizing:border-box}
html{background:#d8d0c2}
body{margin:0;background:#d8d0c2;color:var(--ink);font-family:"Readex Pro","Noto Sans Arabic",Tahoma,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:12px;background:rgba(37,35,31,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.toolbar button{border:0;background:var(--paper);color:var(--ink);font:600 14px "Readex Pro",sans-serif;border-radius:999px;padding:11px 24px;cursor:pointer}
.toolbar button.ghost{background:transparent;color:var(--paper);border:1px solid rgba(245,240,231,.4)}
.page{max-width:820px;margin:28px auto;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.25);
  background:radial-gradient(40% 18% at 85% 6%,rgba(232,160,112,.22),transparent 70%),radial-gradient(45% 22% at 5% 40%,rgba(150,186,130,.18),transparent 70%),radial-gradient(40% 18% at 90% 85%,rgba(226,184,96,.18),transparent 70%),
  radial-gradient(circle at 20% 30%,rgba(120,100,70,.05) 0 1px,transparent 2px) 0 0/23px 23px,radial-gradient(circle at 70% 60%,rgba(120,100,70,.05) 0 1.5px,transparent 2.5px) 0 0/37px 37px,var(--paper)}
.frame{margin:0;padding:46px 48px 50px;position:relative}
.corner-tl,.corner-tr,.corner-bl,.corner-br{display:none}
.brandhead{text-align:center;margin-bottom:6px}
.brandhead img{width:min(320px,70%);height:auto;margin:0 auto 4px;display:block}
.brandhead h1,.brandhead .sub{display:none}
.brandhead .tagline{margin:10px 0 0;font-size:13px;color:var(--muted)}
.rule{display:flex;align-items:center;gap:14px;margin:22px 0 30px}
.rule span{flex:1;height:1px;background:var(--line)}
.rule i{width:7px;height:7px;border-radius:50%;background:var(--olive);font-size:0;display:inline-block}
.section{margin-bottom:8px}
.section + .section{margin-top:40px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 4px}
.section-title b{font:500 34px/1.3 var(--display);color:var(--ink)}
.section-pics{display:flex}
.section-pics img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--paper);margin-inline-start:-16px;box-shadow:0 6px 14px rgba(60,40,20,.18)}
.section-pics img:first-child{margin-inline-start:0}
.section-rule{display:flex;align-items:center;gap:10px;margin:10px 0 22px}
.section-rule span{flex:1;height:1px;background:var(--line)}
.section-rule i{display:none}
.section-cats{column-count:2;column-gap:44px}
.cat{break-inside:avoid;margin-bottom:24px}
.cat h3{margin:0 0 10px;font:600 15px "Readex Pro",sans-serif;color:var(--olive);display:flex;align-items:center;gap:8px}
.cat h3:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--olive)}
.row{margin-bottom:11px}
.row-top{display:flex;align-items:baseline}
.row .name{font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink)}
.row .star{color:var(--olive);margin-inline-end:4px;font-size:11px}
.row .dtag{font-size:12px;margin-inline-start:3px}
.leader{flex:1 1 auto;border-bottom:1px dotted #b3a993;margin:0 6px;position:relative;top:-4px;min-width:8px}
.row .price{white-space:nowrap;font-weight:600;font-size:13.5px;color:var(--ink)}
.row .price small{font-weight:400;font-size:11px;color:var(--muted);margin-inline-start:3px}
.row .en{font-size:11px;color:var(--muted);margin-top:1px}
.foot{margin-top:8px;text-align:center}
.foot .rule{margin:30px 0 16px}
.foot p{margin:0;font-size:12px;color:var(--muted);line-height:1.9}
.foot .thanks{font:500 22px var(--display);color:var(--ink);margin-bottom:6px}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
@media (max-width:680px){.section-cats{column-count:1}.frame{padding:28px 20px 34px}.section-title b{font-size:28px}.section-pics img{width:50px;height:50px}}
@media print{
  @page{margin:0}
  .toolbar{display:none}
  html,body{background:#fff}
  .page{box-shadow:none;margin:0;max-width:none;border-radius:0}
  .frame{padding:16mm 15mm}
  .section{break-before:page}
  .section:first-child{break-before:auto}
  .cat{break-inside:avoid}
}
</style>
</head>
<body>
<div class="toolbar">
<button class="ghost" onclick="olvPageBack('admin.html')">→ رجوع</button>
<button onclick="window.print()">طباعة</button>
</div>

<div class="page">
<div class="frame">
<span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>

<div class="brandhead">
<img src="assets/olv-logo-full.webp" alt="OLV Luxury Café &amp; Restaurant">
<h1>OLV</h1>
<div class="sub">LUXURY CAFÉ &amp; RESTAURANT</div>
<div class="tagline" id="tagline">مطعم وكافيه</div>
</div>
<div class="rule"><span></span><i>◆</i><span></span></div>

<div id="body"><div class="empty">جاري تحميل المنيو...</div></div>

<div class="foot">
<div class="rule"><span></span><i>◆</i><span></span></div>
<div class="thanks">بالهنا والشفا</div>
<p>الأسعار بالدينار الأردني وقابلة للتغيير دون إشعار مسبق<br><span id="surchargeNote"></span><br><span id="wa"></span></p>
<p style="font-size:11px;margin-top:8px">© 2026 OLV. جميع الحقوق محفوظة.</p>
</div>

</div>
</div>

<script src="assets/back-nav.js"></script>
<script>
const $=id=>document.getElementById(id);
function tagBadges(i){const t=i.tags||[];let h='';if(t.includes('veg'))h+='<span class="dtag" title="نباتي">🌱</span>';if(t.includes('spicy'))h+='<span class="dtag" title="حار">🌶️</span>';return h}
const GROUPS=[
  {title:'المقبلات والأطباق الرئيسية',cats:['offers','burgers','snacks','sandwiches','breakfast','pizza','pasta','salads']},
  {title:'المشروبات',cats:['hot','cold','cocktails','juices','shakes']},
  {title:'الحلويات',cats:['desserts','cakes','icecream','scoops','donuts','waffles','crepes']},
  {title:'الأرجيلة',cats:['shisha']}
];
function row(i){
  // صنف بحجمين: صغير / كبير
  const price=i.large&&i.large.price?`${Number(i.price).toFixed(2)} / ${Number(i.large.price).toFixed(2)}`:Number(i.price).toFixed(2);
  return `<div class="row">
    <div class="row-top">
      <span class="name">${i.popular?'<span class="star">★</span>':''}${i.ar}${tagBadges(i)}</span>
      <span class="leader"></span>
      <span class="price">${price}<small>د.أ</small></span>
    </div>
    ${i.en?`<div class="en">${i.en}</div>`:''}
  </div>`;
}
// ثلاث صور من أشهر أصناف القسم جنب العنوان
function pics(DATA,g){const a=DATA.items.filter(i=>g.cats.includes(i.cat)&&i.image&&i.available!==false);a.sort((x,y)=>Number(!!y.popular)-Number(!!x.popular));const p=a.slice(0,3);return p.length?`<span class="section-pics">${p.map(i=>`<img src="${i.image}" alt="">`).join('')}</span>`:''}
async function init(){
  try{
    const DATA=await fetch('data/menu.json',{cache:'no-store'}).then(r=>r.json());
    $('tagline').textContent=DATA.settings?.taglineAr||'مطعم وكافيه';
    $('wa').textContent=DATA.settings?.whatsappNumber?('للطلب والتواصل: '+DATA.settings.whatsappNumber):'';
    const pct=Number(DATA.settings?.hallSurchargePercent)||0;$('surchargeNote').textContent=pct>0?`الأسعار أعلاه لطلبات السفري والتوصيل — عند الطلب داخل الكافيه تُضاف ${pct}% لكل الأصناف`:'';
    const catMap=new Map(DATA.categories.map(c=>[c.id,c]));
    let html='';
    GROUPS.forEach(g=>{
      let catsHtml='';
      g.cats.forEach(catId=>{
        const cat=catMap.get(catId);
        if(!cat)return;
        const items=DATA.items.filter(i=>i.cat===catId&&i.available!==false&&!i.variants);
        if(!items.length)return;
        catsHtml+=`<div class="cat"><h3>${cat.ar}</h3>${items.map(row).join('')}</div>`;
      });
      if(!catsHtml)return;
      html+=`<div class="section"><div class="section-title"><b>${g.title}</b>${pics(DATA,g)}</div><div class="section-rule"><span></span><i></i><span></span></div><div class="section-cats">${catsHtml}</div></div>`;
    });
    $('body').innerHTML=html||'<div class="empty">لا توجد أصناف متاحة حالياً.</div>';
  }catch(e){
    $('body').innerHTML='<div class="empty">تعذر تحميل المنيو.</div>';
  }
}
init();
</script>
</body>
</html>
